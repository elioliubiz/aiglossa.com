<!doctype html>
<html lang="{{lang}}" dir="{{dir}}" data-lang-name="{{current_name}}">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{share_heading}} — AIGLOSSA</title><meta name="description" content="{{description}}"><link rel="canonical" href="{{canonical}}">{{alternates}}
<meta name="robots" content="noindex,follow">
<link rel="icon" href="{{prefix}}assets/favicon-skin.svg?v={{asset_v}}">
<link rel="stylesheet" href="{{prefix}}assets/skin.css?v={{asset_v}}">
</head>
<body class="share-body">
<header class="topbar"><div class="wrap topbar-inner"><a class="brand" href="https://skin.aiglossa.com/{{lang}}/skin/"><span class="brand-mark skin-logo"><img src="{{prefix}}assets/favicon-skin.svg?v={{asset_v}}" alt=""></span> AIGLOSSA</a><a class="pill-btn" href="https://skin.aiglossa.com/{{lang}}/skin/">{{share_cta}}</a></div></header>
<main class="wrap share-wrap">
  <a class="back" id="shareBack" href="https://skin.aiglossa.com/{{lang}}/skin/">← {{back}}</a>
  <div id="shareContent"><div class="share-loading">{{scan_pending}}</div></div>
</main>
<footer><div class="wrap footer-inner"><span>{{footer_disclaimer}}</span></div></footer>
<script type="application/json" id="ui">{{ui_json}}</script>
<script src="{{prefix}}assets/skin-share.js?v={{asset_v}}"></script>
</body>
</html>
