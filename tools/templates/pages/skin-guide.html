<!doctype html><html lang="{{lang}}" dir="{{dir}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>{{title}}</title><meta name="description" content="{{description}}"><link rel="canonical" href="{{canonical}}">{{alternates}}<meta name="theme-color" content="#F8FAFC"><script>(function(){var m=matchMedia("(prefers-color-scheme:dark)");function s(){document.documentElement.dataset.theme=m.matches?"dark":"light"}s();if(m.addEventListener)m.addEventListener("change",s);else m.addListener(s)})();</script><link rel="icon" href="{{prefix}}assets/favicon-skin.svg?v={{asset_v}}"><link rel="stylesheet" href="{{prefix}}assets/skin.css?v={{asset_v}}"><script type="application/ld+json">{{jsonld}}</script></head>
<body class="skin-guide-page"><header class="topbar"><div class="wrap topbar-inner"><a class="brand" href="{{prefix}}{{lang}}/skin/" aria-label="AIGLOSSA SKIN"><span class="brand-mark skin-logo"><img src="{{prefix}}assets/favicon-skin.svg?v={{asset_v}}" alt=""></span>AIGLOSSA</a><a class="guide-back" href="{{prefix}}{{lang}}/skin/">{{back_to_skin}}</a></div></header><main><article class="skin-guide-doc"><nav class="page-breadcrumb"><a href="{{prefix}}{{lang}}/skin/">AIGLOSSA SKIN</a><span>/</span><b>{{guide_kicker}}</b></nav><header><span class="kicker">{{guide_kicker}}</span><h1>{{guide_title}}</h1><p>{{guide_description}}</p></header><div class="skin-guide-body">{{guide_body}}</div></article></main><footer><div class="wrap footer-inner"><span>AIGLOSSA SKIN</span><div class="footer-links"><a href="{{prefix}}{{lang}}/skin/">{{back_to_skin}}</a></div></div></footer></body></html>
