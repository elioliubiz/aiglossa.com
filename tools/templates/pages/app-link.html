<!DOCTYPE html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>{{page_title}}</title>
<link rel="canonical" href="{{canonical}}">
{{alternates}}
<style>
  :root { color-scheme: light dark; --bg:#f5f4f1; --card:#fff; --fg:#24211f; --muted:#756e68; }
  @media(prefers-color-scheme:dark) { :root { --bg:#181716; --card:#242220; --fg:#f5f4f1; --muted:#c0b9b1; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100svh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--fg); font:16px/1.6 -apple-system,BlinkMacSystemFont,system-ui,sans-serif; }
  main { max-width:430px; padding:32px; background:var(--card); border-radius:24px; text-align:center; }
  h1 { margin:0 0 12px; font-size:24px; } p { color:var(--muted); }
  a { display:inline-block; margin-block-start:12px; padding:12px 24px; border-radius:24px; background:#6c5143; color:#fff; text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<main><h1>{{page_title}}</h1><p>{{body}}</p><a href="{{store_url}}">{{button}}</a></main>
</body>
</html>
