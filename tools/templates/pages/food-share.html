<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{share_heading}} · AIGLOSSA FOOD</title><meta name="robots" content="noindex"><link rel="canonical" href="{{canonical}}">{{alternates}}
<meta name="description" content="{{footer_disclaimer}}">
<meta name="theme-color" content="#F5F9F7"><meta name="apple-mobile-web-app-capable" content="yes">
<script>(function(){try{localStorage.removeItem("aiglossa_theme")}catch(e){}var m=matchMedia("(prefers-color-scheme: dark)");function sync(){var dark=m.matches;document.documentElement.dataset.theme=dark?"dark":"light";var meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=dark?"#121A18":"#F5F9F7"}sync();if(m.addEventListener)m.addEventListener("change",sync);else m.addListener(sync)})();</script>
<link rel="icon" href="{{prefix}}assets/favicon-food.svg?v={{asset_v}}"><link rel="apple-touch-icon" href="{{prefix}}assets/apple-touch-icon-food.png?v={{asset_v}}">
<link rel="stylesheet" href="{{prefix}}assets/food.css?v={{asset_v}}">
</head>
<body class="share-page">
<header class="topbar"><div class="wrap topbar-inner">
  <a class="brand" href="../" aria-label="AIGLOSSA FOOD"><span class="brand-mark food-logo"><img src="{{prefix}}assets/favicon-food.svg?v={{asset_v}}" alt=""></span> AIGLOSSA</a>
  <a class="pill-btn share-top-cta" href="../">{{share_cta}}</a>
</div></header>
<main class="share-main">
  <div class="report-skeleton" id="shareLoading" aria-busy="true" aria-label="{{loading_report}}"><div class="wrap skeleton-hero"><span class="skeleton-cover"></span><div class="skeleton-copy"><i></i><i></i><i></i></div></div><div class="wrap skeleton-report"><div class="skeleton-cards"><span></span><span></span><span></span></div><aside></aside></div><span class="sr-only">{{loading_report}}</span></div>
  <div class="wrap share-error hidden" id="shareError"><h1>{{scan_failed}}</h1><a class="btn" href="../">{{cta}}</a></div>
  <article class="hidden" id="shareContent">
    <header class="share-report-hero"><div class="wrap share-report-top">
      <div class="share-label" id="shareLabel"><span class="thumb-skeleton"></span><img class="hidden" id="shareImage" alt=""></div>
      <div class="share-copy"><span class="kicker">{{share_heading}} · AIGLOSSA FOOD</span><h1 id="shareName">—</h1><p class="share-meta" id="shareMeta"></p><div class="result-facts" id="shareFacts"></div></div>
    </div></header>
    <div class="wrap share-report-grid">
      <div class="result-main" id="shareReportMain"></div>
      <aside class="sidebar"><div class="side-card share-side"><span class="side-kicker">AIGLOSSA FOOD</span><h3>{{share_cta}}</h3><p class="side-intro">{{footer_disclaimer}}</p><a class="btn full" href="../">{{cta}}</a></div></aside>
    </div>
  </article>
</main>
<footer><div class="wrap footer-inner">
  <span class="brand"><span class="brand-mark food-logo" style="width:22px;height:22px;border-radius:7px"><img src="{{prefix}}assets/favicon-food.svg?v={{asset_v}}" alt=""></span> AIGLOSSA <b>FOOD</b></span>
  <div class="footer-links"><a href="{{legal_privacy_href}}">{{privacy}}</a><a href="{{legal_terms_href}}">{{terms}}</a></div>
  <span>{{footer_disclaimer}}</span>
</div></footer>
<script type="application/json" id="ui">{{ui_json}}</script>
<script src="{{prefix}}assets/food-share.js?v={{asset_v}}"></script>
</body>
</html>
