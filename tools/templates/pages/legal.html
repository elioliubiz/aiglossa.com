<!DOCTYPE html>
<html lang="{{lang}}" dir="{{dir}}" data-default-lang="{{default}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
{{alternates}}
<meta property="og:type" content="article">
<meta property="og:site_name" content="aiglossa">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:locale" content="{{og_locale}}">
{{robots}}
<meta name="theme-color" content="#0e0f11">
<link rel="icon" href="{{prefix}}assets/favicon-tools.svg" type="image/svg+xml">
<link rel="icon" href="{{prefix}}assets/favicon-tools.svg" sizes="any">
<link rel="apple-touch-icon" href="{{prefix}}assets/apple-touch-icon-tools.png">
<link rel="manifest" href="{{prefix}}assets/manifest-tools.webmanifest">
<link rel="stylesheet" href="{{prefix}}assets/site.css">
<link rel="stylesheet" href="{{prefix}}assets/theme.css">
<style>
  .doc{max-width:760px;margin-inline:auto;padding-block:64px 40px;padding-inline:24px}
  .doc h1{font-size:clamp(28px,4vw,40px);line-height:1.12;letter-spacing:-.03em;margin:0 0 14px;font-weight:600}
  .doc h2{font-size:17px;margin-block:34px 10px;font-weight:600;letter-spacing:-.01em}
  .doc h3{font-size:15px;margin-block:22px 8px;font-weight:600}
  .doc p,.doc li{color:var(--muted);font-size:14.5px;line-height:1.75;margin-block:10px}
  .doc ul,.doc ol{padding-inline-start:20px}
  .doc a{color:var(--accent);text-decoration:none}
  .doc strong{color:var(--fg)}
  .doc .updated{font-size:12px;color:var(--dim);margin-block:0 26px}
  footer{border-block-start:1px solid var(--line);padding-block:26px}
  footer .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  footer .brand{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  footer nav a{color:var(--muted);font-size:12.5px;text-decoration:none;margin-inline-end:14px}
  .switcher{position:relative}
  .switcher summary{list-style:none;cursor:pointer;font-size:12.5px;color:var(--muted);
                    border:1px solid var(--line);border-radius:999px;padding-block:7px;padding-inline:14px}
  .switcher summary::-webkit-details-marker{display:none}
  .switcher ul{position:absolute;inset-inline-end:0;bottom:calc(100% + 8px);z-index:5;margin:0;
               padding:6px;list-style:none;background:#16181c;border:1px solid var(--line);
               border-radius:12px;max-height:260px;overflow:auto;min-width:160px;
               box-shadow:0 12px 32px rgba(0,0,0,.5)}
  .switcher li a{display:block;padding-block:7px;padding-inline:10px;border-radius:8px;
                 color:var(--muted);text-decoration:none;font-size:13px}
  .switcher li a[aria-current]{color:var(--fg);background:rgba(255,255,255,.06)}
</style>
</head>
<body>
<main class="doc">
{{body}}
</main>

<footer>
  <div class="wrap">
    <span class="brand">aiglossa tools</span>
    <nav>
      <a href="https://aiglossa.com/{{lang}}/protocol/privacy.html">{{legal_privacy}}</a>
      <a href="https://aiglossa.com/{{lang}}/protocol/term.html">{{legal_terms}}</a>
      <a href="pricing.html">{{refund_label}}</a>
    </nav>
    <details class="switcher">
      <summary>{{lang_label}} · {{current_name}}</summary>
      <ul>
{{switcher}}
      </ul>
    </details>
  </div>
</footer>

<script src="{{prefix}}assets/site.js" defer></script>
</body>
</html>
