<!DOCTYPE html>
<html lang="{{lang}}" dir="{{dir}}" data-default-lang="{{default}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
{{alternates}}
<meta property="og:type" content="article">
<meta property="og:site_name" content="aiglossa">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:locale" content="{{og_locale}}">
<meta property="og:image" content="{{site_base}}/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0e0f11">
<link rel="icon" href="{{prefix}}assets/favicon-tools.svg" type="image/svg+xml">
<link rel="icon" href="{{prefix}}assets/favicon-tools.svg" sizes="any">
<link rel="apple-touch-icon" href="{{prefix}}assets/apple-touch-icon-tools.png">
<link rel="stylesheet" href="{{prefix}}assets/site.css">
<link rel="stylesheet" href="{{prefix}}assets/theme.css">
<style>
  .doc{max-width:720px;margin-inline:auto;padding-block:64px 40px;padding-inline:24px}
  .doc h1{font-size:clamp(28px,4.4vw,42px);line-height:1.15;letter-spacing:-.03em;margin:0 0 16px;font-weight:600}
  .doc h2{font-size:20px;margin-block:36px 10px;font-weight:600;letter-spacing:-.01em}
  .doc h3{font-size:16px;margin-block:24px 8px;font-weight:600}
  .doc p,.doc li{color:var(--muted);font-size:15.5px;line-height:1.75;margin-block:12px}
  .doc ul,.doc ol{padding-inline-start:22px}
  .doc a{color:var(--accent);text-decoration:none}
  .doc strong{color:var(--fg)}
  .doc .lead{font-size:17.5px;color:var(--fg)}
  .doc .cta{display:inline-block;margin-block-start:28px;padding-block:13px;padding-inline:22px;
            border-radius:10px;background:var(--accent);color:#1a0e04;font-weight:600;text-decoration:none}
  .doc .meta{font-size:12px;color:var(--dim);margin-block:0 28px}
  .doc blockquote{margin:20px 0;padding-inline-start:16px;border-inline-start:2px solid var(--accent)}
  .doc blockquote p{color:var(--fg);font-style:italic}
  footer{border-block-start:1px solid var(--line);padding-block:26px}
  footer .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  footer .brand{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  footer nav a{color:var(--muted);font-size:12.5px;text-decoration:none;margin-inline-end:14px}
</style>
<script type="application/ld+json">{{jsonld}}</script>
</head>
<body>
<main class="doc">
{{body}}
</main>

<footer>
  <div class="wrap">
    <span class="brand">aiglossa tools</span>
    <nav>
      <a href="../music/">AI Music Generator</a>
      <a href="../pricing.html">{{legal_terms}}</a>
      <a href="https://aiglossa.com/{{lang}}/protocol/privacy.html">{{legal_privacy}}</a>
    </nav>
  </div>
</footer>
</body>
</html>
