<!DOCTYPE html>
<html lang="{{lang}}" dir="{{dir}}" data-default-lang="{{default}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
{{alternates}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="aiglossa">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:locale" content="{{og_locale}}">
<meta property="og:image" content="{{site_base}}/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="AIGLOSSA TOOLS">
<meta name="twitter:card" content="summary_large_image">
<script type="application/ld+json">{{jsonld}}</script>
<link rel="icon" href="{{prefix}}assets/favicon-tools.svg?v={{asset_v}}" type="image/svg+xml">
<link rel="icon" href="{{prefix}}assets/favicon-tools.svg?v={{asset_v}}" sizes="any">
<link rel="apple-touch-icon" href="{{prefix}}assets/apple-touch-icon-tools.png?v={{asset_v}}">
<link rel="manifest" href="{{prefix}}assets/manifest-tools.webmanifest?v={{asset_v}}">
<meta name="theme-color" content="#0e0f11">
<link rel="stylesheet" href="{{prefix}}assets/site.css">
<link rel="stylesheet" href="{{prefix}}assets/theme.css">
<style>
  .hub-hero{padding:96px 0 40px}
  .hub-hero h1{font-size:clamp(38px,6vw,64px);line-height:1.04;letter-spacing:-.03em;margin:14px 0 16px;
               background:none;-webkit-text-fill-color:currentColor;color:#fff}
  /* site.css 的 .lede 是 margin:auto 居中（营销页用），工具索引要左对齐 */
  .hub-hero .lede{margin:24px 0 0;max-width:46ch}
  .tools{padding:8px 0 8px}
  .tool-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
  @media(max-width:900px){.tool-grid{grid-template-columns:1fr}}
  .tool{display:flex;flex-direction:column;gap:10px;padding:24px;border:1px solid rgba(255,255,255,.1);
        border-radius:18px;background:rgba(255,255,255,.025);text-decoration:none;color:inherit;
        transition:border-color .15s,background .15s,transform .15s}
  a.tool:hover{border-color:rgba(255,255,255,.24);background:rgba(255,255,255,.05);transform:translateY(-2px)}
  .tool.soon{opacity:.62}
  .tool-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .tool-name{font-size:19px;font-weight:600;letter-spacing:-.01em}
  .badge{font:10px/1 -apple-system,sans-serif;letter-spacing:.14em;text-transform:uppercase;
         padding:6px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.18);color:var(--muted,#96a0b5)}
  .badge.live{border-color:rgba(255,138,76,.5);color:#ffb27a;background:rgba(255,138,76,.12)}
  .tool-desc{font-size:14px;line-height:1.6;color:var(--muted,#96a0b5);margin:0}
  .tool-meta{font:11.5px/1.4 -apple-system,sans-serif;color:var(--muted,#96a0b5);opacity:.8;margin:0}
  .tool-go{margin-top:auto;padding-top:8px;font-size:13px;color:#ff8a4c}
  .tool.soon .tool-go{color:var(--muted,#96a0b5)}
  .guide-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  .guide-list li a{display:block;padding-block:12px;padding-inline:16px;border:1px solid rgba(255,255,255,.1);
                   border-radius:12px;background:rgba(255,255,255,.02);color:var(--fg);text-decoration:none;font-size:14px}
  .guide-list li a:hover{border-color:rgba(255,255,255,.24);background:rgba(255,255,255,.05)}
  .closing-band{padding:26px 0 72px;border-top:1px solid rgba(255,255,255,.07);margin-top:34px}
  .closing-band .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .closing-band p{margin:0;color:var(--muted,#96a0b5);font-size:14px}
  .closing-band .cta{white-space:nowrap}
  .tools-nav{border-bottom:1px solid rgba(255,255,255,.08)}
  .tools-nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:18px;padding-block:16px}
  .tools-brand{display:inline-flex;align-items:center;gap:9px;font:11px/1 -apple-system,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--fg);text-decoration:none}
  .tools-brand img{width:26px;height:26px;border-radius:7px;display:block}
  .foot .brand{display:inline-flex;align-items:center;gap:9px;font:11px/1 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;font-weight:400}
  .foot .brand img{width:22px;height:22px;border-radius:6px;display:block}
  .tools-account{display:inline-flex;align-items:center;gap:10px;color:var(--muted,#96a0b5);font-size:13px;text-decoration:none}
  .tools-account:hover{color:var(--fg)}
  .tools-avatar{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;
                border:1px solid rgba(255,255,255,.22);background:rgba(255,122,26,.12);color:#ffb27a;font-size:12px;font-weight:600}
  .tools-account-copy{display:flex;align-items:baseline;gap:8px}
  .tools-account-balance{color:var(--fg);font-variant-numeric:tabular-nums}
  .tools-account-email{max-width:22ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media(max-width:560px){.tools-nav .wrap{padding-inline:20px}.tools-account-email{display:none}}
</style>
</head>
<body>
<header class="tools-nav">
  <div class="wrap">
    <a class="tools-brand" href="./"><img src="{{prefix}}assets/favicon-tools.svg?v={{asset_v}}" alt=""> AIGLOSSA TOOLS</a>
    <a class="tools-account" id="toolsAccount" href="login.html?next=./">
      <span class="tools-avatar" id="toolsAvatar" aria-hidden="true">?</span>
      <span class="tools-account-copy">
        <span class="tools-account-email" id="toolsAccountEmail">{{account_label}}</span>
        <span class="tools-account-balance" id="toolsAccountBalance"></span>
      </span>
    </a>
  </div>
</header>
<main>
  <section class="hub-hero">
    <div class="wrap">
      <p class="kicker">AIGLOSSA TOOLS</p>
      <h1>{{h1}}</h1>
      <p class="lede">{{lede}}</p>
    </div>
  </section>

  <section class="tools">
    <div class="wrap">
      <div class="tool-grid">
{{tools}}
      </div>
    </div>
  </section>



  <section class="closing-band">
    <div class="wrap">
      <p>{{note}}</p>
      <a class="cta" href="{{cta_href}}">{{cta_label}}</a>
    </div>
  </section>
</main>

<footer>
  <div class="wrap foot">
    <span class="brand"><img src="{{prefix}}assets/favicon-tools.svg?v={{asset_v}}" alt=""> AIGLOSSA TOOLS</span>
    <nav class="legal">
      <a href="{{legal_privacy_href}}">{{legal_privacy}}</a>
      <a href="{{legal_terms_href}}">{{legal_terms}}</a>
    </nav>
    <details class="switcher">
      <summary>{{lang_label}} · {{current_name}}</summary>
      <ul>
{{switcher}}
      </ul>
    </details>
  </div>
</footer>

<script src="{{prefix}}assets/site.js" defer></script>
<script>
(function () {
  "use strict";
  localStorage.removeItem("aig_token");
  localStorage.removeItem("aig_email");
  var api = location.hostname === "localhost" || location.hostname === "127.0.0.1"
    ? "/api"
    : (location.hostname === "tools.staging.aiglossa.com"
      ? "https://dev.staging.aiglossa.com"
      : "https://api.aiglossa.com");
  var root = location.hostname === "tools.staging.aiglossa.com" ? "https://staging.aiglossa.com" : "https://aiglossa.com";
  document.getElementById("toolsAccount").href = root + "/{{lang}}/login.html?next=" + encodeURIComponent(location.href);
  var device = localStorage.getItem("aig_device") || "";
  if (!device) {
    device = crypto.randomUUID ? crypto.randomUUID() : String(Date.now());
    localStorage.setItem("aig_device", device);
  }
  fetch(api + "/wallet/summary", {
    method: "POST", credentials: "include",
    headers: {"Content-Type": "application/json", "X-Client": "web"},
    body: JSON.stringify({app_key: "tools", device: device, timestamp: Math.floor(Date.now() / 1000)})
  }).then(function (r) { return r.json(); }).then(function (data) {
    if (data.code === 401 || data.code !== 200 || !data.data) return;
    var user = data.data.user || {};
    var name = user.email || user.nickname || "{{account_label}}";
    document.getElementById("toolsAccountEmail").textContent = name;
    document.getElementById("toolsAccountBalance").textContent = Math.round((data.data.balance || 0) / 100) + " {{credits_unit}}";
    document.getElementById("toolsAvatar").textContent = name.slice(0, 1).toUpperCase();
    document.getElementById("toolsAccount").href = root + "/{{lang}}/account.html";
  }).catch(function () {});
})();
</script>
</body>
</html>
