<!DOCTYPE html>
<html lang="{{lang}}" dir="{{dir}}" data-default-lang="{{default}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
{{alternates}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="Scholan">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:locale" content="{{og_locale}}">
<meta property="og:image" content="{{site_base}}/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Scholan">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{site_base}}/assets/og.png">
<meta name="theme-color" content="#07070a">
<link rel="icon" href="{{prefix}}assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{prefix}}assets/apple-touch-icon.png">
<link rel="stylesheet" href="{{prefix}}assets/site.css">
<style>
  :root{--bg:#07070a;--ink:#f4f2ee;--mut:#8b8b96;--line:rgba(255,255,255,.10);--acc:#ff7a1a}
  html,body{overflow-x:clip;max-width:100%}
  img{max-width:100%}
  body{background:var(--bg);color:var(--ink)}
  .aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .aurora i{position:absolute;border-radius:50%;filter:blur(110px);opacity:.5}
  .aurora i.a{width:70vmax;height:70vmax;inset-inline-start:-12vmax;top:-32vmax;
              background:radial-gradient(circle,rgba(255,122,26,.20),transparent 65%)}
  .aurora i.b{width:56vmax;height:56vmax;inset-inline-end:-18vmax;top:6vmax;
              background:radial-gradient(circle,rgba(255,122,26,.14),transparent 66%)}
  main,footer{position:relative;z-index:1}

  .hero{position:relative;overflow-x:clip;max-width:100vw;min-height:auto;display:block;background:none;text-align:center;
        padding-block:clamp(64px,11vh,120px) 0}
  .hero .wrap{position:relative;z-index:1;max-width:820px;margin-inline:auto;padding-inline:24px}
  .shot{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:11/10;
        background:linear-gradient(150deg,#1a1a20,#0d0d10 55%,#151519)}
  .shot img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.05)}
  .shot::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,8,10,.9),transparent 42%)}
  @media(max-width:900px){.shot{aspect-ratio:16/9}}
  .hero .kicker{color:var(--acc);letter-spacing:.3em;font-size:11px}
  .hero h1{font-size:clamp(26px,5.2vw,62px);line-height:1.03;letter-spacing:-.04em;margin:18px auto 0;
           max-width:18ch;font-weight:600;background:none;-webkit-text-fill-color:currentColor;color:var(--ink)}
  .hero .lede{margin:22px auto 0;max-width:48ch;color:var(--mut);font-size:16px;line-height:1.65}
  .store{display:inline-flex;align-items:center;gap:10px;margin-block-start:30px;padding:13px 22px;
         border-radius:14px;background:#f5f5f7;color:#111;text-decoration:none;font-weight:600;font-size:14.5px;
         transition:transform .2s}
  .store:hover{transform:translateY(-2px)}
  .store svg{width:21px;height:21px}
  .store span{font-size:16px;letter-spacing:-.01em}

  .stage{position:relative;overflow-x:clip;margin:clamp(20px,2.6vh,34px) auto 0;width:100%;max-width:1240px;
         padding-inline:3vw}
  .hero::before{content:"";position:absolute;left:50%;top:-18%;transform:translateX(-50%);
        width:min(1500px,140vw);height:min(1050px,120vh);z-index:0;pointer-events:none;
        background:radial-gradient(ellipse at 50% 40%,rgba(255,122,26,.22),rgba(255,122,26,.07) 46%,transparent 68%)}
  .devices{position:relative;width:100%;aspect-ratio:16/9.6;max-height:680px;z-index:1;
           -webkit-mask-image:linear-gradient(180deg,#000 76%,rgba(0,0,0,.55) 92%,transparent 100%);
           mask-image:linear-gradient(180deg,#000 76%,rgba(0,0,0,.55) 92%,transparent 100%)}
  .frame{padding:clamp(5px,0.62vw,9px);background:linear-gradient(155deg,#57575f,#1e1e24 45%,#34343c 72%,#17171c);
         box-shadow:0 34px 70px -34px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.2)}
  .frame img{display:block;width:100%;height:auto}
  .frame.tab{position:absolute;left:8%;top:1.5%;width:74%;border-radius:clamp(12px,1.7vw,24px);z-index:1}
  .frame.tab img{border-radius:clamp(8px,1.15vw,16px)}
  .frame.ph{position:absolute;left:68%;bottom:0;width:24%;border-radius:clamp(16px,2.1vw,30px);z-index:2;box-shadow:0 30px 60px -28px rgba(0,0,0,.8),
            inset 0 1px 0 rgba(255,255,255,.22)}
  .frame.ph img{border-radius:clamp(11px,1.5vw,21px)}

  /* 下面三行介绍 */
  .features{overflow-x:clip;max-width:980px;margin:clamp(52px,8vh,88px) auto 0;padding-inline:24px;
            display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(20px,3.4vw,44px)}
  .features > div{border-block-start:1px solid var(--line);padding-block-start:20px}
  .features .n{display:block;font-size:11px;letter-spacing:.22em;color:var(--acc);margin-block-end:12px}
  .features h3{margin:0 0 9px;font-size:16.5px;letter-spacing:-.01em}
  .features p{margin:0;color:var(--mut);font-size:13.5px;line-height:1.68}
  @media(max-width:760px){.features{grid-template-columns:1fr;gap:28px}}


  .closing{max-width:620px;margin:clamp(52px,8vh,84px) auto 0;text-align:center;color:var(--mut);
           font-size:13.5px;line-height:1.8;padding-inline:24px}
  footer{margin-block-start:64px;padding-block:26px;border-block-start:1px solid var(--line)}
  footer .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
               max-width:1000px;margin-inline:auto;padding-inline:24px}
  footer .brand{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
  footer nav a{color:var(--mut);font-size:12.5px;text-decoration:none;margin-inline-end:14px}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i class="a"></i><i class="b"></i></div>

<main>
  <section class="hero">
    <div class="wrap">
      <div class="hero-copy">
      <p class="kicker">SCHOLAN</p>
      <h1>{{h1}}</h1>
      <p class="lede">{{lede}}</p>
      <a class="store" href="{{app_href}}">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.7c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.7.8-3.4.8-.7 0-1.8-.8-3-.8-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 6.9 1.2 9.2.8 1.1 1.7 2.3 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7c1.3 0 2.1-1.1 2.8-2.2.9-1.3 1.3-2.5 1.3-2.6-.1 0-2.6-1-2.6-3.7zM14.2 5.9c.6-.7 1-1.7.9-2.7-.9.04-1.9.6-2.5 1.3-.6.6-1 1.6-.9 2.6 1 .1 1.9-.5 2.5-1.2z"/></svg>
        <span>App Store</span>
      </a>
      </div>
    </div>
  </section>

  <div class="stage">
    <div class="devices">
      <div class="frame tab"><img src="{{shot_spread}}" alt="Scholan on iPad" width="2266" height="1488"></div>
      <div class="frame ph"><img src="{{shot_phone}}" alt="Scholan on iPhone" width="1320" height="2868" loading="lazy"></div>
    </div>
  </div>

  <div class="features">
{{steps}}
  </div>

  <p class="closing">{{closing}}</p>
</main>

<footer>
  <div class="wrap">
    <span class="brand">{{brand}}</span>
    <nav class="legal">
      <a href="{{legal_privacy_href}}">{{legal_privacy}}</a>
      <a href="{{legal_terms_href}}">{{legal_terms}}</a>
    </nav>
    <details class="switcher">
      <summary>{{lang_label}} · {{current_name}}</summary>
      <ul>
{{switcher}}
      </ul>
    </details>
  </div>
</footer>

<script src="{{prefix}}assets/site.js" defer></script>
</body>
</html>
