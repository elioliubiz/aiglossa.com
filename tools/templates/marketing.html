<!DOCTYPE html>
<html lang="{{lang}}" dir="{{dir}}" data-default-lang="{{default}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
{{alternates}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="Scholan">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:locale" content="{{og_locale}}">
<meta property="og:image" content="{{site_base}}/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Scholan">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{site_base}}/assets/og.png">
<meta name="theme-color" content="#07070a">
<link rel="icon" href="{{prefix}}assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{prefix}}assets/apple-touch-icon.png">
<link rel="stylesheet" href="{{prefix}}assets/site.css">
<style>
  :root{--bg:#07070a;--ink:#f4f2ee;--mut:#8b8b96;--line:rgba(255,255,255,.10);--acc:#b98cff}
  body{background:var(--bg);color:var(--ink);overflow-x:hidden}
  .aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .aurora i{position:absolute;border-radius:50%;filter:blur(110px);opacity:.5}
  .aurora i.a{width:70vmax;height:70vmax;inset-inline-start:-10vmax;top:-30vmax;
              background:radial-gradient(circle,rgba(150,110,255,.38),transparent 65%)}
  .aurora i.b{width:60vmax;height:60vmax;inset-inline-end:-20vmax;top:10vmax;
              background:radial-gradient(circle,rgba(255,130,90,.22),transparent 66%)}
  main,footer{position:relative;z-index:1}

  .hero{min-height:auto;display:block;background:none;text-align:center;
        padding-block:clamp(64px,10vh,120px) 0}
  .hero .kicker{color:var(--mut);letter-spacing:.3em;font-size:11px}
  .hero h1{font-size:clamp(34px,5.6vw,68px);line-height:1.02;letter-spacing:-.04em;
           margin:20px auto 0;max-width:16ch;font-weight:600;background:none;
           -webkit-text-fill-color:currentColor;color:var(--ink)}
  .hero .lede{margin:24px auto 0;max-width:52ch;color:var(--mut);font-size:16px;line-height:1.65}
  .store{display:inline-flex;align-items:center;gap:11px;margin-block-start:32px;padding:13px 22px;
         border-radius:15px;background:#f5f5f7;color:#111;text-decoration:none;font-weight:600;font-size:15px;
         transition:transform .2s}
  .store:hover{transform:translateY(-2px)}
  .store svg{width:22px;height:22px}
  .store small{display:block;font-size:10px;font-weight:400;opacity:.6;letter-spacing:.06em;margin-bottom:1px}

  /* ---- 设备边框 ---- */
  .frame{position:relative;border-radius:26px;padding:10px;background:linear-gradient(155deg,#57575f,#1e1e24 45%,#34343c 72%,#17171c);
         box-shadow:0 60px 120px -50px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.22)}
  .frame img{display:block;width:100%;height:auto;border-radius:18px}
  .frame.land{border-radius:22px}
  .frame.land img{border-radius:14px}
  .hero-shot{max-width:1060px;margin:clamp(44px,7vh,76px) auto 0;padding-inline:24px}
  .hero-shot .glowpad{position:relative}
  .hero-shot .glowpad::before{content:"";position:absolute;inset:-8% -6%;z-index:-1;border-radius:40px;
        background:radial-gradient(ellipse at 50% 40%,rgba(150,110,255,.28),transparent 68%);filter:blur(40px)}

  .sec{padding-block:clamp(72px,11vh,130px)}
  .sec .wrap{max-width:1060px;margin-inline:auto;padding-inline:24px}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,64px);align-items:center}
  @media(max-width:860px){.split{grid-template-columns:1fr}}
  .split h2{font-size:clamp(24px,3vw,36px);letter-spacing:-.03em;line-height:1.12;margin:0 0 14px}
  .split p{color:var(--mut);font-size:15.5px;line-height:1.7;margin:0}
  .phone-wrap{max-width:300px;margin-inline:auto}
  .eyebrow{color:var(--acc);font-size:11px;letter-spacing:.22em;text-transform:uppercase}

  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;max-width:1060px;margin-inline:auto;padding-inline:24px}
  @media(max-width:820px){.steps{grid-template-columns:1fr}}
  .step{padding:26px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.025)}
  .step b{display:block;color:var(--acc);font-size:11px;letter-spacing:.2em;margin-bottom:12px}
  .step h3{margin:0 0 8px;font-size:17px}
  .step p{margin:0;color:var(--mut);font-size:14px;line-height:1.65}
  .closing{max-width:640px;margin:clamp(56px,8vh,90px) auto 0;text-align:center;color:var(--mut);
           font-size:14px;line-height:1.8;padding-inline:24px}

  footer{margin-block-start:70px;padding-block:26px;border-block-start:1px solid var(--line)}
  footer .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
               max-width:1060px;margin-inline:auto;padding-inline:24px}
  footer .brand{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
  footer nav a{color:var(--mut);font-size:12.5px;text-decoration:none;margin-inline-end:14px}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i class="a"></i><i class="b"></i></div>

<main>
  <section class="hero">
    <div class="wrap">
      <p class="kicker">SCHOLAN</p>
      <h1>{{h1}}</h1>
      <p class="lede">{{lede}}</p>
      <a class="store" href="{{app_href}}">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.7c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.7.8-3.4.8-.7 0-1.8-.8-3-.8-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 6.9 1.2 9.2.8 1.1 1.7 2.3 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7c1.3 0 2.1-1.1 2.8-2.2.9-1.3 1.3-2.5 1.3-2.6-.1 0-2.6-1-2.6-3.7zM14.2 5.9c.6-.7 1-1.7.9-2.7-.9.04-1.9.6-2.5 1.3-.6.6-1 1.6-.9 2.6 1 .1 1.9-.5 2.5-1.2z"/></svg>
        <span><small>Download on the</small>App Store</span>
      </a>
    </div>
    <div class="hero-shot">
      <div class="glowpad">
        <div class="frame land"><img src="{{shot_spread}}" alt="Scholan reading view on iPad" width="2266" height="1488"></div>
      </div>
    </div>
  </section>

  <section class="sec">
    <div class="wrap split">
      <div class="phone-wrap"><div class="frame"><img src="{{shot_phone}}" alt="Glosses inline in the text" width="1320" height="2868" loading="lazy"></div></div>
      <div>
        <p class="eyebrow">01</p>
        <h2>{{steps_1_h}}</h2>
        <p>{{steps_1_p}}</p>
      </div>
    </div>
  </section>

  <section class="sec">
    <div class="wrap">
      <div class="frame land"><img src="{{shot_ipad_lib}}" alt="Library on iPad" width="2266" height="1488" loading="lazy"></div>
    </div>
  </section>

  <section class="sec">
    <div class="steps">
{{steps}}
    </div>
    <p class="closing">{{closing}}</p>
  </section>
</main>

<footer>
  <div class="wrap">
    <span class="brand">{{brand}}</span>
    <nav class="legal">
      <a href="{{legal_privacy_href}}">{{legal_privacy}}</a>
      <a href="{{legal_terms_href}}">{{legal_terms}}</a>
    </nav>
    <details class="switcher">
      <summary>{{lang_label}} · {{current_name}}</summary>
      <ul>
{{switcher}}
      </ul>
    </details>
  </div>
</footer>

<script src="{{prefix}}assets/site.js" defer></script>
</body>
</html>
