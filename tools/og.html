<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<!-- 分享预览图（Open Graph）源文件：用无头 Chrome 渲染成 assets/og.png（1200×630）。
     重新生成：见 README「品牌图」一节。 -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;
    background:#0b0d12;color:#eef1f6;display:flex;align-items:center;
    background-image:radial-gradient(58% 62% at 78% 12%,rgba(88,120,255,.42),transparent 70%),
                     radial-gradient(46% 52% at 8% 92%,rgba(150,96,255,.30),transparent 72%)}
  .pad{padding:0 84px;width:100%}
  .kicker{font-size:22px;font-weight:600;letter-spacing:.22em;color:#8fb0ff}
  h1{margin-top:22px;font-size:74px;line-height:1.1;letter-spacing:-.02em;font-weight:700;
    background:linear-gradient(96deg,#fff 24%,#b9caff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .words{margin-top:44px;display:flex;gap:14px;flex-wrap:wrap}
  .chip{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);border-radius:999px;
    padding:11px 20px;font-size:22px;color:#d9e0ee}
  .chip b{color:#fff;font-weight:600}
  .chip span{color:#8fa0bb;margin-left:8px}
  .foot{margin-top:46px;font-size:20px;color:#7c869a;letter-spacing:.04em}
</style></head>
<body><div class="pad">
  <p class="kicker">SCHOLAN</p>
  <h1>Read foreign books<br>with a head start</h1>
  <div class="words">
    <span class="chip"><b>éphémère</b><span>fleeting</span></span>
    <span class="chip"><b>懐かしい</b><span>nostalgic</span></span>
    <span class="chip"><b>木漏れ日</b><span>light through leaves</span></span>
  </div>
  <p class="foot">aiglossa.com</p>
</div></body></html>
