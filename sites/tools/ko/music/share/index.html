<style>
  :root{--bg:#0e0f11;--panel:#16181c;--ink:#f2f1ec;--muted:#92959c;--line:rgba(242,241,236,.13);--acc:#ff7a1a}
  *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
  body{font:14px/1.55 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
  .share-shell{min-height:100vh;display:flex;flex-direction:column}
  .share-top{display:flex;justify-content:space-between;align-items:center;padding:20px clamp(20px,5vw,64px);border-bottom:1px solid var(--line)}
  .brand{color:var(--muted);font-size:11px;letter-spacing:.2em;text-transform:uppercase;text-decoration:none}
  .brand i{display:inline-block;width:7px;height:7px;margin-inline-end:8px;border-radius:50%;background:var(--acc)}
  .top-link{color:var(--muted);text-decoration:none;font-size:13px}.top-link:hover{color:var(--ink)}
  .share-main{width:min(1080px,100%);margin:0 auto;padding:clamp(28px,6vw,72px) clamp(20px,5vw,64px) 120px}
  .share-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);gap:clamp(28px,6vw,76px);align-items:center}
  .art{position:relative;aspect-ratio:1/1;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:#191b20;box-shadow:0 24px 70px rgba(0,0,0,.28)}
  .art img{width:100%;height:100%;display:block;object-fit:cover}.art canvas{width:82%;height:42%;position:absolute;inset:29% 9%;display:block}
  .art-wave{background:radial-gradient(circle at 50% 45%,rgba(255,122,26,.16),transparent 56%),#191b20}
  .art-overlay{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.3))}
  .play{width:72px;height:72px;border:1px solid rgba(255,255,255,.6);border-radius:50%;background:rgba(10,12,14,.68);color:#fff;font-size:22px;cursor:pointer;backdrop-filter:blur(8px)}
  .play:hover{background:rgba(255,122,26,.9);border-color:var(--acc)}
  .copy h1{font-size:clamp(30px,5vw,56px);line-height:1.08;letter-spacing:-.035em;margin:0 0 14px;font-weight:600}
  .copy .eyebrow{color:var(--acc);font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin:0 0 12px}
  .copy .meta{color:var(--muted);margin:0 0 24px;font-size:14px}.copy .lyrics{color:var(--muted);line-height:1.75;margin:0 0 28px;white-space:pre-line;max-height:190px;overflow:auto;scroll-behavior:smooth}
  .lyrics.sync{display:flex;flex-direction:column;gap:3px;white-space:normal}.lyrics.sync span{display:block;padding:4px 0;transition:color .2s ease,transform .2s ease;transform-origin:inset-inline-start}.lyrics.sync span.active{color:var(--ink);transform:scale(1.035)}.lyrics.sync span.unmatched{opacity:.48}
  .actions{display:flex;gap:9px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:9px;padding:11px 16px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font:inherit;text-decoration:none;cursor:pointer}.btn:hover{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.09)}.btn.primary{background:var(--acc);border-color:var(--acc);color:#1b0d03;font-weight:600}.btn.primary:hover{background:#ff9144}.btn[disabled]{opacity:.5;cursor:default}
  .hint{margin:18px 0 0;color:var(--muted);font-size:12px}.error{padding:32px;text-align:center;color:var(--muted)}
  .share-player{position:fixed;inset-inline:0;bottom:0;z-index:10;display:flex;align-items:center;gap:14px;min-height:72px;padding:10px clamp(20px,5vw,64px);background:rgba(14,15,18,.88);border-top:1px solid var(--line);backdrop-filter:blur(16px)}
  .bar{position:relative;flex:1;height:5px;border-radius:5px;background:rgba(255,255,255,.14);cursor:pointer}.bar span{position:absolute;inset-block:0;inset-inline-start:0;width:0;border-radius:5px;background:var(--acc)}.time{color:var(--muted);font-size:12px;white-space:nowrap}
  .share-player .mini{width:38px;height:38px;border:0;border-radius:50%;background:var(--ink);color:#111;cursor:pointer}.share-player .name{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media(max-width:760px){.share-grid{grid-template-columns:1fr;gap:28px}.art{max-width:520px;margin:auto}.copy{text-align:center}.copy .lyrics{text-align:start}.actions{justify-content:center}.share-player{gap:9px;padding-inline:16px}.share-player .name{display:none}.share-player .bar{min-width:70px}}
</style>
</head>
<body>
<div class="share-shell">
  <header class="share-top"><a class="brand" href="../"><i></i>aiglossa tools</a><a class="top-link" href="../">곡 생성</a></header>
  <main class="share-main" id="share-main"><div class="error">불러오는 중…</div></main>
  <div class="share-player" id="share-player" hidden>
    <button class="mini" id="mini-play" type="button" aria-label="Play">▶</button><span class="name" id="mini-name"></span>
    <div class="bar" id="bar"><span></span></div><span class="time" id="time">0:00 / 0:00</span>
  </div>
</div>
<script type="application/json" id="ui">{"title": "AI 음악 생성 — 사진에서 곡으로, 정확한 길이", "description": "사진이나 프롬프트로 30~90초에 딱 맞는 배경 음악을 만듭니다. 가사는 사진 속 내용을 노래하고, 10개 언어 보컬과 이음새 없는 루프를 지원합니다.", "h1": "곡 만들기", "sub": "사진 또는 프롬프트에서. 길이는 정확하게, 루프는 매끄럽게.", "drop": "사진을 놓거나 선택하세요<br>가사가 사진 속 내용을 노래합니다", "generate": "곡 생성", "how_credits": "크레딧 계산 방식 →", "grp_photo": "들어보기", "grp_recipe": "용도에서 시작", "download": "다운로드", "save_recipe": "레시피로 저장", "use_recipe": "레시피 사용", "remove_photo": "사진 제거", "photo_here": "여기에 사진", "note": "오른쪽은 모두 여기서 만들어졌습니다", "legal_aup": "이용 정책", "legal_refund": "환불 정책", "sign_in_first": "생성하려면 로그인", "generating": "생성 중… 약 20초.", "just_generated": "방금 생성됨", "your_track": "내 곡", "from_recipe": "레시피에서", "from_photo": "사진에서 제작", "err_load": "옵션을 불러오지 못했습니다", "done_in": "{n}초 만에 완료", "gen_cost": "생성 · {n}", "err_gen": "생성에 실패했습니다", "my_track": "내 트랙", "err_net": "네트워크 오류", "recipe_name": "레시피 이름", "err_save": "저장하지 못했습니다", "saved": "저장됨: {name}", "up_to": "최대 {n}", "credits": "크레딧", "guides_link": "가이드 →", "guides_title": "가이드", "close": "닫기", "loading": "불러오는 중…", "off": "끔", "loop_on": "이음새 없는 루프", "buy_credits": "크레딧 구매 →", "desc_label": "추가 설명(선택)", "desc_ph": "원하는 곡을 설명하세요: 비 오는 카페, 피아노 중심", "mode_photo": "사진", "mode_text": "글", "field_density": "편곡 밀도", "opt_sparse": "드문드문", "opt_medium": "보통", "opt_full": "촘촘함", "pro_title": "고급 옵션", "grp_photo_sub": "사진 → 가사 → 곡", "grp_recipe_sub": "용도를 고르면 설정이 채워집니다", "recipe_names": {"short-form-cut": "ショート動画", "hook-sting": "オープニングフック", "product-loop": "製品ループ", "podcast-bed": "ポッドキャストBGM", "documentary-underscore": "ドキュメンタリーBGM", "game-menu-loop": "ゲームメニュー", "calm-focus": "集中学習", "kids-learning": "子ども向け学習"}, "applied": "사용", "current_recipe": "현재 프리셋", "mine_title": "내 작업", "share_link": "링크 공유", "delete_track": "삭제", "delete_track_confirm": "이 곡을 영구적으로 삭제할까요? 이 작업은 취소할 수 없습니다.", "more_actions": "추가 작업", "dl_audio": "오디오 저장", "copied": "복사됨", "shared_note": "공유된 곡을 듣는 중입니다. 아래에서 직접 만들 수 있어요", "my_account": "계정", "balance": "잔액", "pricing_label": "가격", "confirm_gen": "{sec}초 곡을 생성할까요? {n}이 차감됩니다.", "err_insufficient": "크레딧이 부족합니다", "topup_hint": "충전하면 계속 생성할 수 있습니다.", "topup_cta": "충전하기", "cancel": "취소", "confirm": "확인", "not_signed_in": "로그인 안 됨", "traveler": "여행자", "view_all": "전체 보기", "my_works_pick": "하나를 고르면 그때 설정을 재사용합니다", "pay_title": "크레딧 구매", "pay_success": "결제가 완료되어 크레딧이 추가되었습니다.", "pay_opening": "결제 페이지로 이동 중…"}</script>
<script>
(function(){"use strict";
  var UI=JSON.parse(document.getElementById("ui").textContent), lang=document.documentElement.lang, host=location.hostname;
  var api=(host==="localhost"||host==="127.0.0.1")?"/api":host.indexOf("staging.aiglossa.com")>=0?"https://dev.staging.aiglossa.com":"https://api.aiglossa.com";
  var audio=new Audio();audio.preload="metadata";var track=null,activeLyric=-1;
  function call(id,token){return fetch(api+"/ai/music/public/"+id,{method:"POST",headers:{"Content-Type":"application/json","X-Client":"web"},body:JSON.stringify({app_key:"tools",device:"share-"+Date.now(),timestamp:Math.floor(Date.now()/1000),t:token})}).then(function(r){return r.json()})}
  function fmt(s){s=isFinite(s)?s:0;return Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0")}
  function esc(s){var d=document.createElement("div");d.textContent=s||"";return d.innerHTML}
  function wave(peaks){var c=document.createElement("canvas"),x=c.getContext("2d"),p=peaks||[];c.width=960;c.height=300;x.fillStyle="rgba(255,255,255,.72)";p.forEach(function(v,i){var h=Math.max(3,v/255*260);x.fillRect(i*960/p.length,150-h/2,Math.max(2,960/p.length-3),h)});return c.toDataURL()}
  function copy(text){if(navigator.clipboard)return navigator.clipboard.writeText(text);var t=document.createElement("textarea");t.value=text;t.style.position="fixed";t.style.opacity=0;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();return Promise.resolve()}
  function plainLyrics(raw){var lines=String(raw||"").split(/\r?\n/).map(function(x){return x.trim()}).filter(Boolean),marked=lines.filter(function(x){return /^\s*\[:\]/.test(x)});if(marked.length)return marked.map(function(x){return x.replace(/^\s*\[:\]\s*/,"")});return lines.filter(function(x){return !/^\s*\[\[.*\]\]\s*$/.test(x)&&!/^<?instrumental>?$/i.test(x)})}
  function lyricMarkup(it){var timing=it.lyrics_timing&&it.lyrics_timing.lines;if(timing&&timing.length)return '<div class="lyrics sync" id="lyrics">'+timing.map(function(x,i){return '<span data-i="'+i+'" class="'+(x.matched?'':'unmatched')+'">'+esc(x.text)+'</span>'}).join("")+'</div>';var lines=plainLyrics(it.output_text);return lines.length?'<p class="lyrics">'+lines.map(esc).join("\n")+'</p>':""}
  function updateLyrics(){var lines=track&&track.lyrics;if(!lines||!lines.length)return;var now=Math.round(audio.currentTime*1000),next=-1;for(var i=0;i<lines.length;i++){if(lines[i].matched&&now>=lines[i].start_ms&&now<=lines[i].end_ms){next=i;break}}if(next===activeLyric)return;activeLyric=next;document.querySelectorAll("#lyrics span.active").forEach(function(x){x.classList.remove("active")});if(next>=0){var el=document.querySelector('#lyrics span[data-i="'+next+'"]');if(el){el.classList.add("active");el.scrollIntoView({block:"nearest",behavior:"smooth"})}}}
  function render(it,id,token){
    track={id:id,token:token,url:api+it.url,title:UI.my_track,cover:it.cover?api+it.cover:"",lyrics:it.lyrics_timing&&it.lyrics_timing.lines||[]};activeLyric=-1;
    var p=it.params||{}, sec=Math.round((it.duration_ms||0)/1000), title=UI.my_track, meta=fmt(sec);
    var art=track.cover?'<img src="'+esc(track.cover)+'" alt="">':'<div class="art-wave"></div>';
    if(!track.cover&&it.waveform&&it.waveform.peaks)art='<img src="'+wave(it.waveform.peaks)+'" alt="">';
    document.title=title+" — aiglossa tools";
    document.getElementById("share-main").innerHTML='<div class="share-grid"><section class="art">'+art+'<div class="art-overlay"><button class="play" id="play" type="button">▶</button></div></section><section class="copy"><p class="eyebrow">'+UI.shared_note+'</p><h1>'+title+'</h1><p class="meta">'+meta+(p.genre?' · '+esc(p.genre):"")+(p.mood?' · '+esc(p.mood):"")+'</p>'+lyricMarkup(it)+'<div class="actions"><a class="btn primary" id="make" href="../?from='+id+'.'+token+'">'+UI.generate+'</a><button class="btn" id="share" type="button">'+UI.share_link+'</button><a class="btn" href="'+esc(track.url)+'" download>'+UI.download+'</a></div><p class="hint">'+UI.shared_note+'</p></section></div>';
    document.getElementById("share-player").hidden=false;document.getElementById("mini-name").textContent=title;
    document.getElementById("play").onclick=toggle;document.getElementById("mini-play").onclick=toggle;
    document.getElementById("share").onclick=function(){var u=location.href;if(navigator.share)navigator.share({title:title,url:u}).catch(function(){});else copy(u).then(function(){alert(UI.copied)})};
    audio.src=track.url;
  }
  function toggle(){if(audio.paused){audio.play().catch(function(){});document.querySelectorAll("#play,#mini-play").forEach(function(b){b.textContent="❚❚"})}else{audio.pause();document.querySelectorAll("#play,#mini-play").forEach(function(b){b.textContent="▶"})}}
  audio.ontimeupdate=function(){var pct=audio.duration?audio.currentTime/audio.duration*100:0;document.querySelector("#bar span").style.width=pct+"%";document.getElementById("time").textContent=fmt(audio.currentTime)+" / "+fmt(audio.duration);updateLyrics()};
  audio.onended=function(){document.querySelectorAll("#play,#mini-play").forEach(function(b){b.textContent="▶"})};
  document.getElementById("bar").onclick=function(e){if(!audio.duration)return;audio.currentTime=(e.offsetX/this.clientWidth)*audio.duration};
  var m=/[?&]t=(\d+)\.([a-f0-9]+)/.exec(location.search);if(!m){document.getElementById("share-main").innerHTML='<div class="error">'+UI.err_gen+'</div>';return}call(m[1],m[2]).then(function(d){if(d.code!==200)throw Error();render(d.data,m[1],m[2])}).catch(function(){document.getElementById("share-main").innerHTML='<div class="error">'+UI.err_gen+'</div>'});
})();
</script>

<script>
(function () {
  var h = location.hostname;
  if (h.indexOf("staging.aiglossa.com") < 0) return;
  var main = "https://staging.aiglossa.com";
  document.querySelectorAll('a[href^="https://aiglossa.com"]').forEach(function (a) {
    a.href = main + a.getAttribute("href").slice("https://aiglossa.com".length);
  });
})();
</script>
</body>
