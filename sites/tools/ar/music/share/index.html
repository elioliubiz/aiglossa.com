<script>
(function(){"use strict";
  var UI=JSON.parse(document.getElementById("ui").textContent),host=location.hostname,api=(host==="localhost"||host==="127.0.0.1")?"/api":host.indexOf("staging.aiglossa.com")>=0?"https://dev.staging.aiglossa.com":"https://api.aiglossa.com";
  var audio=new Audio();audio.preload="metadata";var track=null,raf=0,active=-2;
  function call(id,token){return fetch(api+"/ai/music/public/"+id,{method:"POST",headers:{"Content-Type":"application/json","X-Client":"web"},body:JSON.stringify({app_key:"tools",device:"share-"+Date.now(),timestamp:Math.floor(Date.now()/1000),t:token})}).then(function(r){return r.json()})}
  function esc(s){var d=document.createElement("div");d.textContent=s||"";return d.innerHTML}function fmt(s){s=isFinite(s)?Math.max(0,s):0;return Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0")}
  function copy(text){if(navigator.clipboard)return navigator.clipboard.writeText(text);var t=document.createElement("textarea");t.value=text;t.style.position="fixed";t.style.opacity=0;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();return Promise.resolve()}
  function clean(raw){var lines=String(raw||"").split(/\r?\n/).map(function(x){return x.trim()}).filter(Boolean),marked=lines.filter(function(x){return /^\s*\[:\]/.test(x)});if(marked.length)return marked.map(function(x){return x.replace(/^\s*\[:\]\s*/,"")});return lines.filter(function(x){return !/^\s*\[\[.*\]\]\s*$/.test(x)&&!/^<?instrumental>?$/i.test(x)})}
  function renderLyrics(it){var lines=it.lyrics_timing&&it.lyrics_timing.lines;if(lines&&lines.length)return '<div class="lyrics"><div class="lyric-track" id="lyric-track">'+lines.map(function(x,i){return '<div class="lyric-line'+(x.matched?'':' unmatched')+'" data-i="'+i+'">'+esc(x.text)+'</div>'}).join("")+'</div></div>';var plain=clean(it.output_text);return plain.length?'<div class="static-lyrics">'+plain.map(esc).join("\n")+'</div>':""}
  function share(){var u=location.href,title=track?track.title:document.title;if(navigator.share)navigator.share({title:title,url:u}).catch(function(){});else copy(u).then(function(){alert(UI.copied)})}
  function render(it,id,token){var params=it.params||{},title=UI.my_track,cover=it.cover?api+it.cover:"",timing=it.lyrics_timing&&it.lyrics_timing.lines||[];track={id:id,token:token,url:api+it.url,title:title,cover:cover,peaks:it.waveform&&it.waveform.peaks||[],lyrics:timing};document.title=title+" — aiglossa tools";if(cover){var a=document.getElementById("ambient");a.style.backgroundImage='url("'+cover.replace(/"/g,"%22")+'")';a.classList.add("on")}
    var media=cover?'<div class="cover-stage"><div class="disc"><img src="'+esc(cover)+'" alt=""></div><div class="transport"><button class="play" id="play" type="button" aria-label="Play">▶</button><span class="transport-time"><strong id="now">0:00</strong> &nbsp;/&nbsp; <span id="total">'+fmt((it.duration_ms||0)/1000)+'</span></span></div></div>':'<div class="wave-stage" id="wave-stage"><div class="wave-axis"></div><canvas id="wave"></canvas><div class="transport"><button class="play" id="play" type="button" aria-label="Play">▶</button><span class="transport-time"><strong id="now">0:00</strong> &nbsp;/&nbsp; <span id="total">'+fmt((it.duration_ms||0)/1000)+'</span></span></div></div>';var visual='<section class="visual">'+media+'</section>';
    var info='<section class="details"><p class="eyebrow">'+UI.shared_note+'</p><h1>'+title+'</h1><p class="meta"><span>'+fmt((it.duration_ms||0)/1000)+'</span>'+(params.genre?'<span>'+esc(params.genre)+'</span>':'')+(params.mood?'<span>'+esc(params.mood)+'</span>':'')+'</p>'+renderLyrics(it)+'<div class="actions"><a class="action primary" href="../?from='+id+'.'+token+'">'+UI.generate+'</a><button class="action" id="share" type="button">'+UI.share_link+'</button><a class="action" href="'+esc(track.url)+'" download>'+UI.download+'</a></div></section>';
    document.getElementById("main").innerHTML=visual+info;document.getElementById("play").onclick=toggle;document.getElementById("share").onclick=share;document.getElementById("top-share").onclick=share;audio.src=track.url;var ws=document.getElementById("wave-stage");if(ws)ws.onclick=function(e){if(e.target.closest("button")||!audio.duration)return;var r=this.getBoundingClientRect();audio.currentTime=Math.max(0,Math.min(audio.duration,(e.clientX-r.left)/r.width*audio.duration))};draw()}
