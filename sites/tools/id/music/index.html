<style>
  :root{
    --bg:#0e0f11; --panel:#16181c; --ink:#f2f1ec; --mut:#92959c;
    --line:rgba(242,241,236,.12); --acc:#ff7a1a;
    --on-bg:rgba(255,255,255,.22); --on-fg:#ffffff;
    --chip-on-bg:rgba(255,122,26,.18); --chip-on-fg:#ffd9bf;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
  body{font:14px/1.55 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .app{display:grid;grid-template-columns:372px 1fr;height:100vh;min-height:0}
  .rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;
        padding:22px 24px;overflow-y:auto;min-height:0}
  /* 关键：rail 是 flex 列，子项默认 flex-shrink:1，内容一多就会被压缩
     （上传框实测被压到 30px，内容 68px 全被裁掉）。全部禁止收缩，让 rail 自己滚动。 */
  .rail>*{flex:0 0 auto}
  .brand{display:flex;align-items:center;gap:8px;font:10.5px/1 -apple-system,sans-serif;letter-spacing:.2em;
         text-transform:uppercase;color:var(--mut);margin-bottom:18px}
  .brand i{width:7px;height:7px;border-radius:50%;background:var(--acc);display:block}
  .brand a{color:inherit;text-decoration:none}
  h1{font-size:21px;line-height:1.2;letter-spacing:-.02em;margin:0 0 5px;font-weight:600}
  .sub{font-size:12px;color:var(--mut);margin:0 0 14px}
  .drop{border:1px dashed rgba(242,241,236,.2);border-radius:11px;padding:14px;text-align:center;
        color:var(--mut);font-size:12px;background:rgba(255,255,255,.02);margin-bottom:15px;cursor:pointer;
        display:block;overflow:hidden}
  .drop b{display:block;color:var(--ink);font-size:12.5px;margin-bottom:2px;font-weight:600}
  .drop img{width:100%;max-height:120px;object-fit:cover;border-radius:8px;display:block;margin-bottom:8px}
  .drop.over{border-color:var(--acc);background:rgba(255,122,26,.08)}
  .drop.has{border-style:solid;border-color:var(--line);padding:8px}
  .drop .rm{font-size:11px;color:var(--acc);margin-top:6px}
  .sect{margin-bottom:10px}
  .lbl{display:flex;justify-content:space-between;align-items:baseline;font:10px/1 -apple-system,sans-serif;
       letter-spacing:.16em;text-transform:uppercase;color:#9aa0aa;margin-bottom:8px}
  .lbl .r{letter-spacing:0;text-transform:none;font-size:10.5px}
  .seg{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:11px;
       background:rgba(255,255,255,.02)}
  .seg button{flex:1;padding:7px 2px;border:0;border-radius:8px;background:transparent;
              font:inherit;font-size:11.5px;color:var(--ink);cursor:pointer;white-space:nowrap;
              transition:background .15s}
  .seg button:last-child{border-right:0}
  .seg button:hover{background:rgba(255,255,255,.06)}
  .seg button.on{background:var(--on-bg);color:var(--on-fg);font-weight:600;
                box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{padding:6.5px 10.5px;border-radius:7px;border:1px solid var(--line);background:transparent;
        font:inherit;font-size:12px;color:var(--ink);cursor:pointer}
  .chip:hover{border-color:rgba(242,241,236,.28)}
  .chip.on{background:var(--chip-on-bg);color:var(--chip-on-fg);border-color:var(--acc)}
  input[type=range]{width:100%;accent-color:var(--acc);margin:2px 0 0}
  /* 底部吸附条：用渐隐代替硬边框，避免把上一节"切一半"的观感 */
  .modes{display:flex;gap:6px;background:rgba(255,255,255,.04);border:1px solid var(--line);
    border-radius:11px;padding:4px;margin-bottom:10px}
  .mode{flex:1;padding:9px 6px;border:0;border-radius:8px;background:transparent;color:var(--muted);
    font:inherit;font-size:12.5px;cursor:pointer;transition:background .15s,color .15s}
  .mode.on{background:var(--ink);color:#101114;font-weight:600}
  #panelText textarea{width:100%;background:rgba(255,255,255,.03);border:1px solid var(--line);
    border-radius:11px;color:var(--ink);font:inherit;font-size:12.5px;padding:11px;resize:vertical;
    line-height:1.6}
  #panelText textarea::placeholder{color:rgba(242,241,236,.32)}
  #panelText textarea:focus{outline:none;border-color:var(--acc)}
  .note{display:block;margin-top:10px}
  .note>span{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em;margin-bottom:5px}
  .note textarea{width:100%;background:rgba(255,255,255,.03);border:1px solid var(--line);
    border-radius:10px;color:var(--ink);font:inherit;font-size:12.5px;padding:9px 11px;resize:vertical;
    line-height:1.55}
  .note textarea::placeholder{color:rgba(242,241,236,.32)}
  .note textarea:focus{outline:none;border-color:var(--acc)}
  .select{width:100%;appearance:none;-webkit-appearance:none;background:rgba(255,255,255,.04);
    border:1px solid var(--line);border-radius:9px;color:var(--ink);font:inherit;font-size:12.5px;
    padding:9px 34px 9px 12px;cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);
    background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  .select:focus{outline:none;border-color:var(--acc)}
  .prohead{display:flex;align-items:center;justify-content:space-between;width:100%;
    margin:14px 0 6px;padding:9px 2px;background:none;border:0;border-block-start:1px solid var(--line);
    color:var(--muted);font:inherit;font-size:11.5px;letter-spacing:.08em;cursor:pointer}
  .prohead .chev{transition:transform .2s}
  .prohead.open .chev{transform:rotate(180deg)}
  .probody.collapsed{display:none}
  .shared{margin:10px 0;padding:9px 12px;border-radius:9px;font-size:12px;
    background:rgba(255,122,26,.08);border:1px solid rgba(255,122,26,.22);color:rgba(255,208,172,.86)}
  .prechip{display:none;align-items:center;gap:8px;margin:10px 0 12px;padding:8px 10px;
    border-radius:9px;font-size:12px;background:rgba(255,122,26,.08);
    border:1px solid rgba(255,122,26,.22);color:rgba(255,208,172,.86)}
  .prechip.show{display:flex}
  .prechip .k{color:rgba(255,208,172,.5);font-size:11px}
  .prechip b{color:rgba(255,157,77,.9);font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prechip .x{background:none;border:0;color:rgba(255,208,172,.7);font-size:15px;line-height:1;
    cursor:pointer;padding:0 2px}
  .prechip .x:hover{color:#fff}
  .go.flash{box-shadow:0 0 0 3px rgba(255,122,26,.35)}
  .rail-foot{position:sticky;bottom:-22px;margin:0 -24px -22px;padding:46px 24px 22px;
             background:linear-gradient(180deg,rgba(22,24,28,0) 0%,var(--panel) 42%);z-index:2}
  .go{width:100%;display:block;background:var(--acc);color:#1a0e04;border:0;border-radius:11px;padding:15px;
      font:600 13.5px/1 inherit;cursor:pointer}
  .go[disabled]{opacity:.55;cursor:not-allowed}
  .note{font-size:10.5px;color:var(--mut);text-align:center;margin:9px 0 0}
  .only-mobile{display:none}

  /* 指南弹窗：左标题列表 + 右文章，不跳页 */
  .gm{position:fixed;inset:0;z-index:50;display:none}
  .gm.open{display:block}
  .gm .bd{position:absolute;inset:0;background:rgba(6,7,9,.72);backdrop-filter:blur(3px)}
  .gm .panel{position:relative;z-index:1;display:grid;grid-template-columns:280px 1fr;
             width:min(1080px,92vw);height:min(760px,86vh);margin:7vh auto 0;
             background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;
             box-shadow:0 24px 80px rgba(0,0,0,.6)}
  .gm .side{border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .gm .side h2{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);
               margin:0;padding:18px 18px 10px}
  .gm .list{list-style:none;margin:0;padding:0 10px 14px;overflow:auto;flex:1}
  .gm .list a{display:block;padding:10px 12px;border-radius:9px;color:var(--mut);
              text-decoration:none;font-size:13px;line-height:1.45}
  .gm .list a:hover{background:rgba(255,255,255,.05);color:var(--ink)}
  .gm .list a[aria-current="true"]{background:rgba(255,122,26,.14);color:var(--ink)}
  .gm .body{overflow:auto;padding:34px 40px;min-height:0}
  .gm .body h1{font-size:26px;line-height:1.2;margin:0 0 18px;font-weight:600;letter-spacing:-.02em}
  .gm .body h2{font-size:16px;margin:26px 0 8px;font-weight:600}
  .gm .body p,.gm .body li{color:var(--mut);font-size:14px;line-height:1.7;margin:8px 0}
  .gm .body ul{padding-inline-start:20px}
  .gm .body strong{color:var(--ink)}
  .gm .body .cta{display:none}
  .gm .body blockquote{margin:14px 0;padding-inline-start:14px;border-inline-start:2px solid var(--acc)}
  .gm .body .meta{display:none}
  .gm .x{position:absolute;top:14px;inset-inline-end:14px;z-index:2;width:32px;height:32px;
         border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--ink);
         cursor:pointer;font-size:15px;line-height:1}
  @media(max-width:820px){
    .gm .panel{grid-template-columns:1fr;height:88vh;margin-block-start:6vh}
    .gm .side{display:none}
    .gm .body{padding:28px 22px}
  }
  .policy{margin:26px 0 8px;display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px}
  .policy a{color:var(--mut);text-decoration:none}
  .policy a:hover{color:var(--ink)}
  .msg{font-size:11.5px;margin-top:9px;min-height:15px;text-align:center}
  .msg.err{color:#ff9b9b}.msg.ok{color:#9be7b0}
  /* 悬浮在视口底部的播放条：左侧让开参数栏，右侧与内容区对齐 */
  /* 贴边磨砂层：全宽、无圆角，压在内容之上，避免"选项叠在一起"的观感 */
  .playerwrap{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:9px 0 11px;
    background:rgba(14,15,18,.86);backdrop-filter:blur(16px) saturate(120%);
    border-block-start:1px solid rgba(255,255,255,.10)}
  .playerwrap.hidden{display:none}
  /* 播放条内容：与右栏对齐，透明底 */
  .player{display:flex;align-items:center;gap:12px;height:48px;background:none;
    padding-inline:16px;width:100%}
  .player.hidden{display:none}
  .player .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
    white-space:nowrap;flex:0 0 auto}
  .player .ttl{font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;flex:1 1 auto;min-width:0}
  .player .pp{width:36px;height:36px;flex:0 0 auto;border-radius:50%;border:0;background:var(--ink);
    color:#101114;font-size:12px;cursor:pointer;display:grid;place-items:center}
  .player .meta{min-width:0;flex:1}
  .player .meta b{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);margin-bottom:2px}
  .player .meta span{display:block;font-size:12.5px;color:var(--ink);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .player .ptrack{position:relative;flex:1 1 120px;height:4px;border-radius:3px;
    background:rgba(255,255,255,.14);cursor:pointer;min-width:60px}
  .player .ptrack span{position:absolute;inset-block:0;inset-inline-start:0;width:0;
    background:var(--acc);border-radius:3px}
  .player .ptrack i{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;
    background:var(--acc);transform:translate(-50%,-50%);inset-inline-start:0;opacity:0;transition:opacity .15s}
  .player .ptrack:hover i{opacity:1}
  .player .tm{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto}
  .player .acts{display:flex;gap:6px;flex:0 0 auto}
  .player .acts button,.player .acts a{background:rgba(255,255,255,.07);border:1px solid var(--line);
    color:var(--ink);font:inherit;font-size:12px;padding:8px 12px;border-radius:9px;cursor:pointer;
    text-decoration:none}

  .spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.18);
    border-top-color:var(--acc);animation:sp .8s linear infinite;display:block}
  @keyframes sp{to{transform:rotate(360deg)}}
  .mine{margin-bottom:18px}
  .minerow{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px}
  .minerow::-webkit-scrollbar{height:0}
  .mtile{flex:0 0 auto;width:112px;border:1px solid var(--line);border-radius:10px;overflow:hidden;
    background:rgba(255,255,255,.03);cursor:pointer;text-align:start;padding:0}
  .mtile img{width:100%;height:66px;object-fit:cover;display:block}
  .mtile .ph2{height:66px;background:linear-gradient(135deg,rgba(255,122,26,.22),rgba(255,255,255,.05))}
  .mtile p{margin:6px 7px;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .works{padding:20px 26px 30px;overflow-y:auto;min-height:0}
  .whead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
  .whead .t{font:10px/1 -apple-system,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
  .whead .n{font-size:11.5px;color:var(--mut)}
  .photos{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:150px;gap:11px}
  .tile{position:relative;border-radius:13px;overflow:hidden;cursor:pointer;background:#1b1e23;
        border:1px solid transparent}
  .tile:hover{border-color:rgba(255,255,255,.16)}
  .tile.on{border-color:var(--acc)}
  .tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .55s}
  .tile:hover img{transform:scale(1.04)}
  .tile .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,12,10,.04) 34%,rgba(10,12,10,.86))}
  .tile .meta{position:absolute;left:12px;right:12px;bottom:9px;color:#fff}
  .tile .meta .t{font-size:12.5px;font-weight:600;margin:0 0 1px}
  .tile .meta .d{font:10px/1.3 -apple-system,sans-serif;opacity:.82;margin:0}
  .tile .pl{position:absolute;top:9px;right:9px;width:27px;height:27px;border-radius:50%;
            background:rgba(12,14,12,.55);border:1px solid rgba(255,255,255,.32);color:#fff;
            font-size:9px;display:grid;place-items:center;backdrop-filter:blur(6px)}
  .tile.big{grid-column:span 2;grid-row:span 2;cursor:default}
  .tile.big:hover{border-color:transparent}
  .tile.big .shade{background:linear-gradient(180deg,rgba(10,12,10,.1),rgba(10,12,10,.55) 52%,rgba(10,12,10,.93))}
  .tile.big .body{position:absolute;left:16px;right:16px;bottom:14px;color:#fff}
  .tile.big .body .k{font:9.5px/1 -apple-system,sans-serif;letter-spacing:.22em;text-transform:uppercase;
                     opacity:.75;margin:0 0 10px}
  .tile.big .body .ly{font:400 clamp(14px,1.25vw,17.5px)/1.4 "Iowan Old Style",Palatino,Georgia,serif;
                      margin:0 0 12px}
  .tile.big .body .ly b{font-weight:400;box-shadow:inset 0 -.42em 0 rgba(255,122,26,.45)}
  .tile.big .body .noimg{font-size:13px;opacity:.9;margin:0 0 12px}
  .wave{display:flex;align-items:center;gap:2px;height:26px;margin-bottom:9px}
  .wave i{flex:1;background:#fff;opacity:.35;border-radius:1px}
  .wave i.p{opacity:.95;background:var(--acc)}
  .pbar{height:3px;background:rgba(255,255,255,.18);border-radius:2px;overflow:hidden;margin:0 0 10px}
  .pbar span{display:block;height:100%;width:0;background:var(--acc);transition:width .25s linear}
  .brow{display:flex;align-items:center;gap:12px}
  .pp{width:36px;height:36px;border-radius:50%;background:#fff;color:#111;border:0;font-size:11px;cursor:pointer;
      display:grid;place-items:center;flex:0 0 36px}
  .tm{font:11px/1 -apple-system,sans-serif;color:rgba(255,255,255,.75);font-variant-numeric:tabular-nums}
  .acts{margin-left:auto;display:flex;gap:8px}
  .acts a,.acts button{font:11.5px/1 inherit;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.3);
                       background:rgba(0,0,0,.25);border-radius:7px;padding:7px 10px;cursor:pointer}
  .recipes{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
  .rec{border:1px solid var(--line);border-radius:12px;padding:12px 13px 11px;background:rgba(255,255,255,.02);
       cursor:pointer;text-align:left;color:var(--ink);font-family:inherit}
  .rec:hover{border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.045)}
  .rec.on{border-color:var(--acc)}
  .rec .wv{display:flex;align-items:center;gap:2px;height:30px;margin-bottom:10px}
  .rec .wv i{flex:1;background:#fff;opacity:.5;border-radius:1px}
  .rec:hover .wv i{opacity:.85}
  .rec .rn{font-size:12.5px;font-weight:600;margin:0 0 2px}
  .rec .wv{position:relative}
  .rec .rplay{position:absolute;inset-inline-end:8px;top:8px;width:22px;height:22px;border-radius:50%;

<script>
(function () {
  "use strict";
  var UI = JSON.parse(document.getElementById("ui").textContent);
  // 选项标签由后端下发多语言字典：优先当前页面语言，取不到回退英文。
  var LANG = (document.documentElement.lang || "en").replace("_", "-");
  var TOKEN_KEY = "aig_token";
  var API = location.hostname === "tools.aiglossa.com" ? "https://api.aiglossa.com" : "https://dev.aiglossa.com";
  var $ = function (id) { return document.getElementById(id); };
  var token = function () { return localStorage.getItem(TOKEN_KEY) || ""; };
  function device() {
    var v = localStorage.getItem("aig_device");
    if (!v) { v = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())); localStorage.setItem("aig_device", v); }
    return v;
  }
  function call(path, body, auth) {
    var headers = { "Content-Type": "application/json", "X-Client": "web" };
    if (auth) headers["Authorization"] = "Bearer " + token();
    var payload = Object.assign({ app_key: "tools", device: device(), timestamp: Math.floor(Date.now() / 1000) }, body || {});
    return fetch(API + path, { method: "POST", credentials: "include", headers: headers, body: JSON.stringify(payload) }).then(function (r) { return r.json(); });
  }
  function msg(t, kind) { var el = $("msg"); el.textContent = t || ""; el.className = "msg" + (kind ? " " + kind : ""); }

  var DEMOS = [
    { title: "Sea — gentle", meta: "English · 0:30", img: "../../samples/demo-sea.jpg", audio: "../../samples/demo-sea.mp3",
      lyrics: "Gentle <b>sea</b> breathes on the sand. Every <b>wave</b> that meets the <b>beach</b>." },
    { title: "Night rain — neon", meta: "English · 0:45", img: "../../samples/demo-city.jpg", audio: "../../samples/demo-city.mp3",
      lyrics: "A yellow <b>taxi</b> cuts through the <b>neon</b> haze." },
    { title: "Coffee — cálido", meta: "Español · 0:30", img: "../../samples/demo-coffee.jpg", audio: "../../samples/demo-coffee.mp3",
      lyrics: "Huele a <b>café</b>. Mi <b>libro</b>, un amigo." },
    { title: "Bicycle — 古い壁", meta: "日本語 · 0:30", img: "../../samples/demo-bike.jpg", audio: "../../samples/demo-bike.mp3",
      lyrics: "古い<b>壁</b>にもたれた<b>自転車</b>。" }
  ];

  var schema = null, values = {}, imagePayload = null;
  var audio = new Audio(), current = null;
  audio.preload = "none";   // 预览音频只在点击时下载，首屏不拉 13MB

  audio.addEventListener("timeupdate", function () {
    var pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
    var bar = document.querySelector(".pbar span");
    if (bar) bar.style.width = pct + "%";
    var tm = document.querySelector(".tm");
    if (tm) tm.textContent = fmt(audio.currentTime) + " / " + fmt(audio.duration || 0);
  });
  audio.addEventListener("ended", function () { renderBig(); });

  function fmt(s) { if (!isFinite(s)) s = 0; var m = Math.floor(s / 60), r = Math.floor(s % 60); return m + ":" + (r < 10 ? "0" : "") + r; }
  function wave() { var o = "", h; for (var i = 0; i < 36; i++) { h = 16 + Math.abs(Math.sin(i * 0.7)) * 80; o += '<i style="height:' + h.toFixed(0) + '%"></i>'; } return o; }

  function renderPhotos() {
    var box = $("photos"); box.innerHTML = "";

    // 小图统一包一层：桌面端用 display:contents 让它们照旧参与 4 列网格；
    // 移动端则变成一条横滑缩略图。
    var thumbs = document.createElement("div"); thumbs.className = "thumbs"; box.appendChild(thumbs);

    var smalls = DEMOS.slice();
    while (smalls.length < 4) smalls.push(null);

    smalls.forEach(function (d) {
      if (!d) {
        var add = document.createElement("div");
        add.className = "tile add";
        add.innerHTML = "<div>＋<br>Fotomu di sini</div>";
        add.addEventListener("click", function () { $("file").click(); });
        thumbs.appendChild(add);
        return;
      }
      var el = document.createElement("div");
      el.className = "tile";
      el.innerHTML = '<img src="' + d.img + '" alt="' + d.title + '"><div class="shade"></div><span class="pl">▶</span>' +
        '<div class="meta"><p class="t">' + d.title + '</p><p class="d">' + d.meta + '</p></div>';
      el.dataset.audio = d.audio || "";
      el.addEventListener("click", function () { select(Object.assign({ kind: "demo" }, d)); });
      thumbs.appendChild(el);
    });

    renderBig();
  }

  // 正在播放的那一项在列表里高亮，列表本身不重排
  function markPlaying() {
    var cur = current || {};
    Array.prototype.forEach.call(document.querySelectorAll("#photos .tile"), function (el) {
      el.classList.toggle("on", !!cur.audio && el.dataset.audio === cur.audio);
    });
    Array.prototype.forEach.call(document.querySelectorAll("#recipes .rec"), function (el) {
      el.classList.toggle("on", !!cur.name && el.dataset.name === cur.name);
    });
  }

  function renderBig() {
    markPlaying();
    var big = $("player"); if (!big || !current) return;
    $("playerwrap").classList.remove("hidden"); placePlayer();
    var c = current;
    var isPlaying = c.audio && audio.src.indexOf(c.audio) >= 0 && !audio.paused;
    big.innerHTML =
      '<button class="pp" id="pp">' + (isPlaying ? "❚❚" : "▶") + '</button>' +
      '<span class="k">' + (c.kind === "result" ? UI.just_generated : c.kind === "recipe" ? UI.from_recipe : UI.from_photo) + '</span>' +
      '<span class="ttl">' + (c.title || UI.your_track) + '</span>' +
      '<div class="ptrack" id="ptrack"><span id="pfill"></span><i id="pknob"></i></div>' +
      '<span class="tm" id="ptime">0:00 / 0:00</span>' +
      '<div class="acts">' +
        (c.kind === "result"
          ? '<button id="shFile">Unduh audio</button><button id="shLink">Bagikan tautan</button>'
          : (c.audio ? '<a href="' + c.audio + '" download>Unduh</a>' : '')) +
      '</div>';
    $("pp").addEventListener("click", function () { toggleAudio(c.audio); });
    syncPlayer();
    var shFile = $("shFile"), shLink = $("shLink");
    if (shFile) shFile.addEventListener("click", function () { shareFile(); });
    if (shLink) shLink.addEventListener("click", function () { shareLink(); });
  }

  // 把播放条挂到 body 并按右栏实际边界定位（避免祖先容器影响 fixed）
  function placePlayer() {
    var wrap = $("playerwrap"), el = $("player");
    if (!wrap || !el) return;
    if (wrap.parentElement !== document.body) document.body.appendChild(wrap);
    var works = document.querySelector(".works");
    var w = window.innerWidth;
    el.style.marginInlineStart = "0px";
    el.style.width = "100%";
    if (works && w > 1080) {
      // 只覆盖右栏：磨砂层左边缘从内容区开始，不压到参数栏
      wrap.style.left = works.getBoundingClientRect().left + "px";
      wrap.style.right = "0px";
    } else {
      wrap.style.left = "0px";
      wrap.style.right = "0px";
    }
  }
  window.addEventListener("resize", placePlayer);
  window.addEventListener("load", placePlayer);

  // 播放条与 audio 状态同步（播放/暂停/进度/结束）
  function fmtT(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    var m = Math.floor(sec / 60), s2 = Math.floor(sec % 60);
    return m + ":" + (s2 < 10 ? "0" : "") + s2;
  }
  function syncPlayer() {
    var pp = $("pp"); if (pp) pp.textContent = audio.paused ? "▶" : "❚❚";
    var fill = $("pfill"), knob = $("pknob"), tm = $("ptime");
    var d = audio.duration || 0, t = audio.currentTime || 0;
    var pct = d ? (t / d) * 100 : 0;
    if (fill) fill.style.width = pct + "%";
    if (knob) knob.style.insetInlineStart = pct + "%";
    if (tm) tm.textContent = fmtT(t) + " / " + (d ? fmtT(d) : "0:00");
  }
  ["timeupdate", "play", "pause", "ended", "loadedmetadata"].forEach(function (ev) {
    audio.addEventListener(ev, syncPlayer);
  });
  (function bindSeek() {
    var dragging = false;
    function seekTo(clientX) {
      var tr = $("ptrack"); if (!tr || !audio.duration) return;
      var r = tr.getBoundingClientRect();
      var ratio = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
      audio.currentTime = ratio * audio.duration;
      syncPlayer();
    }
    document.addEventListener("pointerdown", function (e) {
      if (!e.target.closest || !e.target.closest("#ptrack")) return;
      dragging = true; e.preventDefault(); seekTo(e.clientX);
      try { e.target.setPointerCapture(e.pointerId); } catch (err) {}
    });
    document.addEventListener("pointermove", function (e) { if (dragging) seekTo(e.clientX); });
    document.addEventListener("pointerup", function () { dragging = false; });
    document.addEventListener("pointercancel", function () { dragging = false; });
  })();

  // 播放/暂停/切歌：只有换曲时才重设 src，同一首继续播放而不是从头
  function toggleAudio(src) {
    if (!src) return;
    var same = audio.dataset.src === src;
    if (same && !audio.paused) { audio.pause(); }
    else if (same && audio.paused) { audio.play().catch(function () {}); }
    else { audio.dataset.src = src; audio.src = src; audio.play().catch(function () {}); }
    syncPlayer();
  }

  // 会话是否存在（cookie 方案下无法本地判断，用一次轻量请求确认）
  var sessionOk = false;
  function checkSession() {
    return call("/ai/music/credits", {}, true).then(function (d) {
      sessionOk = d.code === 200;
      if (sessionOk && d.data) {
        $("bal").textContent = UI.balance + " " + Math.round(d.data.balance / 100) + " " + UI.credits;
      }
      return sessionOk;
    }).catch(function () { sessionOk = false; return false; });
  }

  // 登录前保存草稿（参数 + 压缩照片），回来恢复；不自动生成
  function saveDraft() {
    try {
      var d = { params: values, mode: (typeof mode === "string" ? mode : "photo"), ts: Date.now() };
      if (imagePayload && imagePayload.data) {
        var img = (document.getElementById("prevImg") || {}).src || "";
        if (img.length < 900000) d.img = img;
      }
      sessionStorage.setItem("aig_draft", JSON.stringify(d));
    } catch (e) {}
  }
  function restoreDraft() {
    var raw = sessionStorage.getItem("aig_draft");
    if (!raw) return;
    sessionStorage.removeItem("aig_draft");
    try {
      var d = JSON.parse(raw);
      if (d.params) Object.keys(d.params).forEach(function (k) { if (values[k] !== undefined) values[k] = d.params[k]; });
      if (d.mode) setMode(d.mode);
      if (d.img) {
        imagePayload = { data: d.img.slice(d.img.indexOf(",") + 1), mime: "image/jpeg" };
        $("drop").classList.add("has");
        $("dropText").innerHTML = '<img id="prevImg" src="' + d.img + '" alt=""><span class="rm">Hapus foto</span>';
      }
    } catch (e) {}
  }

  function needLogin() {
    saveDraft();
    var back = location.origin + location.pathname + location.search;
    location.href = "https://aiglossa.com/" + LANG + "/login.html?next=" + encodeURIComponent(back);
  }

  function select(c) {
    current = c;
    renderPhotos();
    renderBig();
    if (c.audio) toggleAudio(c.audio);
    setTimeout(renderBig, 60);
  }

  // ---- 左栏 ----
  function pick(l) {
    if (!l) return "";
    return l[LANG] || l[LANG.split("-")[0]] || l.en || "";
  }
  // 少数后端字段的措辞在前端覆写，避免为改一个词去动后端
  function override(f, o) {
    if (f.key === "density") {
      if (o === undefined) return UI.field_density;
      return { minimal: UI.opt_sparse, medium: UI.opt_medium, full: UI.opt_full }[o] || null;
    }
    return null;
  }
  function label(f) { return override(f) || pick(f.label) || f.key; }

  // 基础项常显；其余归入「专业」并默认折叠
  var BASIC = { duration_seconds:1, loop:1, vocal:1, vocal_language:1, bpm:1, mood:1, genre:1, instrumentation:1 };
  function renderRail() {
    var box = $("rail"); box.innerHTML = "";
    var basic = [], pro = [];
    schema.fields.forEach(function (f) { (BASIC[f.key] ? basic : pro).push(f); });
    basic.forEach(function (f) { box.appendChild(groupOf(f)); });
    if (pro.length) {
      var head = document.createElement("button");
      head.type = "button"; head.className = "prohead";
      head.innerHTML = '<span>' + UI.pro_title + '</span><span class="chev">▾</span>';
      var wrap = document.createElement("div");
      wrap.className = "probody collapsed";
      pro.forEach(function (f) { wrap.appendChild(groupOf(f)); });
      head.addEventListener("click", function () {
        var open = wrap.classList.toggle("collapsed");
        head.classList.toggle("open", !open);
      });
      box.appendChild(head); box.appendChild(wrap);
    }
    applyVisibility(); syncCost();
  }

  function groupOf(f) {
    var wrap = document.createElement("div");
    wrap.className = "sect"; wrap.dataset.key = f.key;
    var head = document.createElement("div"); head.className = "lbl";
    var right = "";
    if (f.key === "duration_seconds") right = '<span class="r" id="cost">' + cost() + " " + UI.credits + '</span>';
    if (f.type === "multi") right = '<span class="r">' + UI.up_to.replace("{n}", f.max) + '</span>';
    if (f.key === "vocal_language") right = '<span class="r">vocal tracks</span>';
    head.innerHTML = "<span>" + label(f) + "</span>" + right;
    wrap.appendChild(head);

    if (f.type === "int") {
      var inp = document.createElement("input");
      inp.type = "range"; inp.min = f.min; inp.max = f.max; inp.step = f.step || 1; inp.value = values[f.key];
      var out = document.createElement("div");
      out.style.cssText = "font-size:10.5px;color:var(--mut);margin-top:4px";
      out.textContent = values[f.key] + " BPM";
      inp.addEventListener("input", function () { values[f.key] = Number(inp.value); out.textContent = inp.value + " BPM"; });
      wrap.appendChild(inp); wrap.appendChild(out);
      return wrap;
    }

    // 选项多的枚举用下拉框：列表会越来越长，芯片行会占掉整屏
    if (f.type === "enum" && f.options.length > 10) {
      var sel = document.createElement("select");
      sel.className = "select";
      f.options.forEach(function (o) {
        var op = document.createElement("option");
        op.value = o.value;
        op.textContent = override(f, o.value) || pick(o.label) || o.value;
        if (values[f.key] === o.value) op.selected = true;
        sel.appendChild(op);
      });
      sel.addEventListener("change", function () {
        values[f.key] = sel.value; applyVisibility(); syncCost();
      });
      wrap.appendChild(sel);
      return wrap;
    }

    var asSeg = f.type === "bool" || (f.type === "enum" && f.options.length <= 5);
    if (asSeg) {
      var row = document.createElement("div"); row.className = "seg";
      var opts = f.type === "bool" ? [{ value: false, label: { en: UI.off } }, { value: true, label: { en: UI.loop_on } }] : f.options;
      opts.forEach(function (o) {
        var b = document.createElement("button");
        b.type = "button";
        b.textContent = override(f, o.value) || pick(o.label) || o.value;
        if (values[f.key] === o.value) b.classList.add("on");
        b.addEventListener("click", function () {
          values[f.key] = o.value;
          Array.prototype.forEach.call(row.children, function (x) { x.classList.remove("on"); });
          b.classList.add("on"); applyVisibility(); syncCost();
        });
        row.appendChild(b);
      });
      wrap.appendChild(row);
      return wrap;
    }

    var chips = document.createElement("div"); chips.className = "chips";
    f.options.forEach(function (o) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip";
      b.textContent = pick(o.label) || o.value;
      var on = f.type === "multi" ? (values[f.key] || []).indexOf(o.value) >= 0 : values[f.key] === o.value;
      if (on) b.classList.add("on");
      b.addEventListener("click", function () {
        if (f.type === "multi") {
          var cur = values[f.key] || [], i = cur.indexOf(o.value);
          if (i >= 0) { cur.splice(i, 1); b.classList.remove("on"); }
          else {
            if (cur.length >= (f.max || 99)) { msg(UI.up_to.replace("{n}", f.max), "err"); return; }
            cur.push(o.value); b.classList.add("on");
          }
          values[f.key] = cur;
        } else {
          values[f.key] = o.value;
          Array.prototype.forEach.call(chips.children, function (x) { x.classList.remove("on"); });
          b.classList.add("on");
        }
        applyVisibility(); syncCost();
      });
      chips.appendChild(b);
    });
    wrap.appendChild(chips);
    return wrap;
  }

  function cond(cv, actual) {
    if (cv && typeof cv === "object") {
      if ("$ne" in cv) return actual !== cv.$ne;
      if ("$in" in cv) return (cv.$in || []).indexOf(actual) >= 0;
    }
    return actual === cv;
  }

  function applyVisibility() {
    schema.fields.forEach(function (f) {
      if (!f.visible_when) return;
      var el = document.querySelector('.sect[data-key="' + f.key + '"]');
      if (!el) return;
      var show = Object.keys(f.visible_when).every(function (k) { return cond(f.visible_when[k], values[k]); });
      el.classList.toggle("hidden", !show);
    });
    if (values.loop) {
      var bf = schema.fields.filter(function (f) { return f.key === "bpm"; })[0] || {};
      var legal = (bf.bpm_by_duration || {})[String(values.duration_seconds)] || [];
      if (legal.length && legal.indexOf(values.bpm) < 0) {
        values.bpm = legal[0];
        var inp = document.querySelector('.sect[data-key="bpm"] input');
        if (inp) inp.value = values.bpm;
        var out = document.querySelector('.sect[data-key="bpm"] div');
        if (out) out.textContent = values.bpm + " BPM";
      }
    }
  }

  function cost() {
    var f = schema && schema.fields.filter(function (x) { return x.key === "duration_seconds"; })[0];
    if (!f) return 45;
    var o = (f.options || []).filter(function (x) { return x.value === values.duration_seconds; })[0];
    return (o && o.cost) || 45;
  }

  function syncCost() {
    var c = $("cost"); if (c) c.textContent = cost() + " " + UI.credits;
    var go = $("go"); if (go) go.textContent = token() ? UI.gen_cost.replace("{n}", cost() + " " + UI.credits) : UI.sign_in_first;
  }

  function fmtDur(sec) { var m = Math.floor(sec / 60), r = sec % 60; return m + ":" + (r < 10 ? "0" : "") + r; }

  // 参数摘要：让"配方 = 一组调好的参数"这件事可见
  function optLabel(key, value) {
    var f = (schema.fields || []).filter(function (x) { return x.key === key; })[0];
    if (!f || !f.options) return value;
    var o = f.options.filter(function (x) { return x.value === value; })[0];
    return o ? (override(f, value) || pick(o.label) || value) : value;
  }
  function paramSummary(p) {
    var bits = [optLabel("genre", p.genre), optLabel("mood", p.mood)];
    if (p.drums) bits.push(optLabel("drums", p.drums));
    return fmtDur(p.duration_seconds || 30) + " · " + bits.filter(Boolean).join(" · ");
  }

  // ---- 配方 ----
  function renderRecipes(items) {
    var box = $("recipes"); box.innerHTML = "";
    items.filter(function (r) { return r.is_system; }).forEach(function (r) {
      var el = document.createElement("button");
      el.type = "button"; el.className = "rec";
      var p = r.params || {};
      var locName = (UI.recipe_names && UI.recipe_names[r.slug]) || r.name;
      el.dataset.name = locName;
      el.innerHTML = '<div class="wv">' + wave() +
        '<span class="rplay" aria-hidden="true">▶</span></div>' +
        '<p class="rn">' + locName + '</p>' +
        '<p class="rd">' + paramSummary(p) + '</p>';
      el.addEventListener("click", function () {
        Array.prototype.forEach.call(box.children, function (x) { x.classList.remove("on"); });
        el.classList.add("on");
        Object.keys(p).forEach(function (k) { if (k.indexOf("__") !== 0) values[k] = p[k]; });
        renderRail();
        applied(locName);
        if (r.sample_url) select({ kind: "recipe", audio: r.sample_url, title: locName, meta: "preset" });
      });
      box.appendChild(el);
    });
  }

  // 套用配方后的反馈：按钮上方出现"将使用…"，并把生成按钮滚进视野
  // 套用的配方常驻显示在表单顶部，用户随时知道当前参数来自哪
  function applied(name) {
    var chip = $("prechip");
    chip.innerHTML = '<span class="k">' + UI.current_recipe + '</span><b>' + name +
      '</b><button type="button" class="x" aria-label="clear">×</button>';
    chip.classList.add("show");
    chip.querySelector(".x").addEventListener("click", function (e) {
      e.stopPropagation(); chip.classList.remove("show"); chip.innerHTML = "";
    });
    var go = $("go");
    if (go && go.getBoundingClientRect().top > innerHeight - 80) {
      go.scrollIntoView({ behavior: "smooth", block: "center" });
    }
    go.classList.add("flash");
    setTimeout(function () { go.classList.remove("flash"); }, 900);
  }

  // ---- 生成 ----
  function generate() {
    if (!sessionOk) { needLogin(); return; }
    $("go").disabled = true;
    msg(UI.generating);
    var body = { params: values };
    if (mode === "photo") {
      if (imagePayload) body.image = imagePayload;
    } else {
      var note = ($("desc").value || "").trim();
      if (note) body.description = note;
    }
    var t0 = Date.now();
    $("playerwrap").classList.remove("hidden");
    $("player").innerHTML = '<span class="spin"></span><span class="ttl">' + UI.generating + '</span>';
    call("/ai/music/generate", body, true).then(function (d) {
      $("go").disabled = false;
      if (d.code === 401) { localStorage.removeItem(TOKEN_KEY); location.reload(); return; }
      if (d.code !== 200) { msg(d.msg || UI.err_gen, "err"); return; }
      var x = d.data;
      msg(UI.done_in.replace("{n}", Math.round((Date.now() - t0) / 1000)), "ok");
      var lines = (x.lyrics || "").replace(/\[[0-9.:]+\]\s?/g, "").split("\n").filter(function (l) { return l.trim(); });
      current = {
        kind: "result", id: x.id, audio: API + x.url, cover: x.cover ? API + x.cover : "",
        img: (document.getElementById("prevImg") || {}).src || "",
        meta: (x.duration_ms / 1000).toFixed(0) + "s · " + x.credits + " credits",
        lyrics: lines.slice(0, 2).join("<br>")
      };
      renderBig();
      toggleAudio(current.audio);
      setTimeout(renderBig, 60);
      Array.prototype.forEach.call($("recipes").children, function (x) { x.classList.remove("on"); });
    }).catch(function () { $("go").disabled = false; msg(UI.err_net, "err"); });
  }

  function saveRecipe() {
    if (!sessionOk) { needLogin(); return; }
    var name = window.prompt(UI.recipe_name, UI.my_track);
    if (!name) return;
    call("/ai/music/recipes/save", { name: name, params: values }, true).then(function (d) {
      msg(d.code === 200 ? UI.saved.replace("{name}", name) : (d.msg || UI.err_save), d.code === 200 ? "ok" : "err");
    });
  }

  // ---- 图片 ----
  function loadPhoto(f) {
    var reader = new FileReader();
    reader.onload = function () {
      var url = String(reader.result || "");
      imagePayload = { data: url.slice(url.indexOf(",") + 1), mime: f.type || "image/jpeg" };
      $("drop").classList.add("has");
      $("dropText").innerHTML = '<img id="prevImg" src="' + url + '" alt=""><span class="rm">Hapus foto</span>';
      $("dropText").onclick = function (ev) {
        ev.preventDefault(); ev.stopPropagation();
        imagePayload = null;
        $("drop").classList.remove("has");
        $("dropText").innerHTML = UI.drop;
        $("dropText").onclick = null; $("file").value = "";
      };
    };
    reader.readAsDataURL(f);
  }
  function loadPhotoFromUrl(url) {
    var img = new Image();
    img.onload = function () { imagePayload = { data: url, mime: "image/url" }; };
    img.onerror = function () {};
    img.src = url;
    $("drop").classList.add("has");
    $("dropText").innerHTML = '<img id="prevImg" src="' + url + '" alt=""><span class="rm">Hapus foto</span>';
    $("dropText").onclick = function (ev) {
      ev.preventDefault(); ev.stopPropagation();
      imagePayload = null; $("drop").classList.remove("has"); $("dropText").textContent = "Seret atau pilih foto<br>lirik akan menyebut isinya";
      $("dropText").onclick = null; $("file").value = "";
    };
  }
  $("file").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    if (f) loadPhoto(f);
  });

  // ---- 输入模式：照片 / 文字，二选一，只提交激活的那个 ----
  var mode = "photo";
  function setMode(m) {
    mode = m;
    $("modePhoto").classList.toggle("on", m === "photo");
    $("modeText").classList.toggle("on", m === "text");
    $("panelPhoto").classList.toggle("hidden", m !== "photo");
    $("panelText").classList.toggle("hidden", m !== "text");
    if (m === "text") $("desc").focus();
  }
  $("modePhoto").addEventListener("click", function () { setMode("photo"); });
  $("modeText").addEventListener("click", function () { setMode("text"); });

  // ---- 拖放：必须在 drop 区域上 preventDefault，否则浏览器会直接打开图片 ----
  ["dragenter", "dragover"].forEach(function (ev) {
    $("drop").addEventListener(ev, function (e) {
      e.preventDefault(); e.stopPropagation();
      $("drop").classList.add("over");
    });
  });
  ["dragleave", "dragend"].forEach(function (ev) {
    $("drop").addEventListener(ev, function (e) {
      e.preventDefault(); e.stopPropagation();
      $("drop").classList.remove("over");
    });
  });
  $("drop").addEventListener("drop", function (e) {
    e.preventDefault(); e.stopPropagation();
    $("drop").classList.remove("over");
    var dt = e.dataTransfer;
    var f = dt && dt.files && dt.files[0];
    if (f) { loadPhoto(f); return; }
    var url = dt && dt.getData && dt.getData("text/uri-list");
    if (url) { loadPhotoFromUrl(url); }
  });
  // 落在页面其它地方时也不要让浏览器接管
  window.addEventListener("dragover", function (e) { e.preventDefault(); });
  window.addEventListener("drop", function (e) { e.preventDefault(); });


  // ---- 分享：直接发文件 / 发播放页链接 ----
  function shareFile() {
    var url = current && current.audio;
    if (!url) return;
    fetch(url).then(function (r) { return r.blob(); }).then(function (blob) {
      var file = new File([blob], "aiglossa-track.mp3", { type: blob.type || "audio/mpeg" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: document.title }).catch(function () {});
      } else {
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
      }
    }).catch(function () { msg(UI.err_gen, "err"); });
  }

  function shareLink() {
    if (!current || !current.id) return;
    call("/ai/music/tracks/" + current.id + "/share", {}, true).then(function (d) {
      if (d.code !== 200) { msg(d.msg || UI.err_gen, "err"); return; }
      var link = location.origin + location.pathname + "?t=" + current.id + "." + d.data.token;
      var done = function () { msg(UI.copied, "ok"); };
      if (navigator.clipboard) navigator.clipboard.writeText(link).then(done).catch(function () { prompt("URL", link); });
      else prompt("URL", link);
    }).catch(function () { msg(UI.err_gen, "err"); });
  }

  // 打开分享链接：?t=<id>.<token> → 读公开信息并载入播放器
  function loadShared() {
    var m = /[?&]t=(\d+)\.([a-f0-9]+)/.exec(location.search);
    if (!m) return;
    call("/ai/music/public/" + m[1], { t: m[2] }, false).then(function (d) {
      if (d.code !== 200) return;
      var it = d.data;
      current = { kind: "result", id: it.id, audio: API + it.url, cover: it.cover ? API + it.cover : "",
                  meta: Math.round((it.duration_ms || 0) / 1000) + "s", lyrics: (it.lyrics || "").slice(0, 120) };
      Object.keys(it.params || {}).forEach(function (k) { if (values[k] !== undefined) values[k] = it.params[k]; });
      renderRail(); renderBig();
      var note = $("shared");
      if (note) { note.textContent = UI.shared_note; note.classList.remove("hidden"); }
    }).catch(function () {});
  }

  // ---- 我的作品（登录后显示） ----
  function loadMine() {
    if (!token()) return;
    call("/ai/music/tracks", { limit: 8 }, true).then(function (d) {
      if (d.code !== 200) return;
      var items = (d.data && d.data.items) || [];
      if (!items.length) return;
      var row = $("mineRow"); row.innerHTML = "";
      items.forEach(function (it) {
        var b = document.createElement("button");
        b.type = "button"; b.className = "mtile";
        b.innerHTML = (it.cover ? '<img src="' + it.cover + '" alt="" loading="lazy">' : '<div class="ph2"></div>') +
          '<p>' + fmtDur(Math.round((it.duration_ms || 0) / 1000)) + '</p>';
        b.addEventListener("click", function () {
          Object.keys(it.params || {}).forEach(function (k) {
            if (values[k] !== undefined) values[k] = it.params[k];
          });
          renderRail();
          current = { kind: "result", audio: it.url, cover: it.cover, title: it.lyrics || "", meta: "mine" };
          renderBig();
          toggleAudio(it.url);
        });
        row.appendChild(b);
      });
      $("mine").classList.remove("hidden");
    }).catch(function () {});
  }

  // ---- 启动 ----
  $("go").addEventListener("click", generate);
  checkSession().then(function (ok) { if (ok) { loadMine(); restoreDraft(); } });
  loadShared();
  call("/ai/music/schema", {}, false).then(function (d) {
    if (d.code !== 200) { msg(UI.err_load, "err"); return; }
    schema = d.data;
    schema.fields.forEach(function (f) { values[f.key] = f.type === "multi" ? (f.default || []).slice() : f.default; });
    // 先定"当前这首"，再渲染照片墙——否则墙里会出现和大画幅重复的那一张
    var d0 = DEMOS[0];
    current = { kind: "demo", img: d0.img, audio: d0.audio, lyrics: d0.lyrics, meta: d0.meta, title: d0.title };
    renderRail(); renderPhotos(); syncCost();
    call("/ai/music/recipes/list", {}, false).then(function (r) {
      if (r.code === 200) renderRecipes(r.data || []);
    });
  });
  // 额度说明：弹窗展示，购买仍走 /pricing.html
  (function () {
    var cm = document.getElementById("cm");
    if (!cm) return;
    var packs = [[180, "$2.99"], [360, "$4.99"], [750, "$9.99"], [1500, "$19.99"], [4000, "$49.99"]];
    function fill() {
      document.getElementById("cmTitle").textContent = UI.how_credits.replace(" →", "");
      document.getElementById("cmList").innerHTML = [UI.li1, UI.li2, UI.li3, UI.li4, UI.li5]
        .map(function (t) { return "<li>" + t + "</li>"; }).join("");
      document.getElementById("cmPacks").innerHTML = packs.map(function (p) {
        return '<div style="display:flex;justify-content:space-between;padding:10px 14px;border:1px solid var(--line);border-radius:9px">' +
               "<span>" + p[0] + " " + UI.credits + "</span><span style=\"color:var(--mut)\">" + p[1] + "</span></div>";
      }).join("");
      document.getElementById("cmBuy").textContent = UI.buy_credits;
    }
    function open() { fill(); cm.classList.add("open"); cm.setAttribute("aria-hidden", "false"); document.body.style.overflow = "hidden"; }
    function close() { cm.classList.remove("open"); cm.setAttribute("aria-hidden", "true"); document.body.style.overflow = ""; }
    document.querySelectorAll('a[href="../pricing.html"]').forEach(function (a) {
      a.addEventListener("click", function (e) { e.preventDefault(); open(); });
    });
    document.querySelectorAll("[data-cclose]").forEach(function (el) { el.addEventListener("click", close); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
  })();

  // 指南：弹窗内切换，不跳页；文章页本身仍可直接访问（SEO）
  (function () {
    var gm = document.getElementById("gm");
    if (!gm) return;
    var list = document.getElementById("gmList"), body = document.getElementById("gmBody");
    var base = "../guides/", cache = {};

    function open() { gm.classList.add("open"); gm.setAttribute("aria-hidden", "false"); document.body.style.overflow = "hidden"; }
    function close() { gm.classList.remove("open"); gm.setAttribute("aria-hidden", "true"); document.body.style.overflow = ""; }
    function load(url) {
      if (cache[url]) return Promise.resolve(cache[url]);
      return fetch(url).then(function (r) { return r.text(); }).then(function (html) {
        var doc = new DOMParser().parseFromString(html, "text/html");
        var main = doc.querySelector("main");
        cache[url] = main ? main.innerHTML : "";
        return cache[url];
      });
    }
    function show(url) {
      body.innerHTML = '<p class="meta">' + UI.loading + "</p>";
      load(url).then(function (html) {
        body.innerHTML = html;
        body.scrollTop = 0;
        Array.prototype.forEach.call(list.querySelectorAll("a"), function (a) {
          a.setAttribute("aria-current", a.getAttribute("href") === url ? "true" : "false");
        });
      }).catch(function () { location.href = url; });
    }

    document.querySelectorAll('a[href="../guides/"]').forEach(function (a) {
      a.addEventListener("click", function (e) { e.preventDefault(); open(); });
    });
    document.querySelectorAll("[data-close]").forEach(function (el) { el.addEventListener("click", close); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });

    load(base).then(function (html) {
      var doc = new DOMParser().parseFromString(html, "text/html");
      var links = Array.prototype.slice.call(doc.querySelectorAll(".guide-list a"));
      if (!links.length) return;
      links.forEach(function (a) {
        var li = document.createElement("li"), link = document.createElement("a");
        link.href = base + a.getAttribute("href");
        link.textContent = a.textContent;
        link.addEventListener("click", function (e) { e.preventDefault(); show(link.getAttribute("href")); });
        li.appendChild(link); list.appendChild(li);
      });
      show(base + links[0].getAttribute("href"));
    }).catch(function () {});
  })();

})();
</script>
</body>
</html>
