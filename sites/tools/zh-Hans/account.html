<style>
  body{min-height:100vh;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;
       padding-block:20px;padding-inline:32px;border-block-end:1px solid var(--line)}
  .top .brand{font:11px/1 -apple-system,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

  .form .sub{color:var(--muted);font-size:13.5px;margin:0 0 26px}
  .divider{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:12px;margin-block:20px}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
  .field{margin-block-end:14px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-block-end:6px}
  .field input{width:100%;padding-block:12px;padding-inline:13px;border-radius:10px;
               border:1px solid var(--line);background:#121317;color:var(--fg);font-size:15px;font-family:inherit}
  .field input:focus{outline:none;border-color:var(--accent)}
  .btn{display:inline-flex;align-items:center;justify-content:center;width:100%;
       padding-block:12px;padding-inline:18px;border-radius:10px;border:0;cursor:pointer;
       background:var(--accent);color:#1a0e04;font:600 14px/1 inherit;text-decoration:none}
  .btn:hover{background:var(--accent-soft)}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
  .btn.ghost:hover{border-color:rgba(255,255,255,.24);background:rgba(255,255,255,.04)}
  .msg{font-size:13px;margin-block-start:12px;min-height:18px}
  .msg.err{color:#ff9b9b}.msg.ok{color:#9be7b0}
  .legal{margin-block-start:14px;font-size:11.5px;color:var(--dim);line-height:1.6}
  .legal a{color:var(--muted)}
  .hidden{display:none !important}
  .balance{font-size:44px;font-weight:600;letter-spacing:-.03em;margin-block:18px 2px}
  .balance small{font-size:14px;font-weight:400;color:var(--muted);margin-inline-start:8px;letter-spacing:0}
  .hint{font-size:12.5px;color:var(--muted);margin-block-start:6px}
  .links{margin-block-start:26px;display:grid;gap:10px}
  .ledger{margin-block-start:28px;border-block-start:1px solid var(--line);padding-block-start:8px}
  .ledger-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding-block:13px;border-block-end:1px solid var(--line)}
  .ledger-kind{font-size:13px;color:var(--fg)}
  .ledger-date{display:block;margin-block-start:3px;font-size:11px;color:var(--dim)}
  .ledger-amount{font-variant-numeric:tabular-nums;font-weight:600}
  .ledger-amount.plus{color:#9be7b0}.ledger-amount.minus{color:#ffb27a}
  .ledger-empty{padding-block:18px;color:var(--muted);font-size:13px}
  footer{border-block-start:1px solid var(--line);padding-block:26px}
  footer .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  footer .brand{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  footer nav a{color:var(--muted);font-size:12.5px;text-decoration:none;margin-inline-end:14px}
  .switcher{position:relative}
  .switcher summary{list-style:none;cursor:pointer;font-size:12.5px;color:var(--muted);
                    border:1px solid var(--line);border-radius:999px;padding-block:7px;padding-inline:14px}
  .switcher summary::-webkit-details-marker{display:none}
  .switcher ul{position:absolute;inset-inline-end:0;bottom:calc(100% + 8px);z-index:5;margin:0;
               padding:6px;list-style:none;background:#16181c;border:1px solid var(--line);
               border-radius:12px;max-height:260px;overflow:auto;min-width:160px;
               box-shadow:0 12px 32px rgba(0,0,0,.5)}
  .switcher li a{display:block;padding-block:7px;padding-inline:10px;border-radius:8px;
                 color:var(--muted);text-decoration:none;font-size:13px}
  .switcher li a[aria-current]{color:var(--fg);background:rgba(255,255,255,.06)}
  @media(max-width:900px){
    .pane{align-items:flex-start;justify-content:flex-start;padding-block:34px 56px;padding-inline:20px}
    .form{max-width:420px;margin-inline:auto}
  }

<script>
(function () {
  "use strict";
  var UI = JSON.parse(document.getElementById("ui").textContent);
  var TOKEN_KEY = "aig_token", EMAIL_KEY = "aig_email";
  var API = location.hostname === "tools.aiglossa.com" ? "https://api.aiglossa.com" : "https://dev.aiglossa.com";
  var $ = function (id) { return document.getElementById(id); };
  function token() { return localStorage.getItem(TOKEN_KEY) || ""; }
  function setToken(t) { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); }
  function device() {
    var v = localStorage.getItem("aig_device");
    if (!v) { v = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())); localStorage.setItem("aig_device", v); }
    return v;
  }
  function call(path, body, auth) {
    var h = { "Content-Type": "application/json", "X-Client": "web" };
    if (auth) h["Authorization"] = "Bearer " + token();
    var payload = Object.assign({ app_key: "tools", device: device(), timestamp: Math.floor(Date.now() / 1000) }, body || {});
    return fetch(API + path, { method: "POST", headers: h, body: JSON.stringify(payload) }).then(function (r) { return r.json(); });
  }
  function showMsg(el, text, kind) { if (!el) return; el.textContent = text || ""; el.className = "msg" + (kind ? " " + kind : ""); }

  function renderSignedIn() {
    $("account-card").classList.remove("hidden");
    $("account-email").textContent = localStorage.getItem(EMAIL_KEY) || "";
    loadCredits();
  }
  function renderSignedOut() {
    var next = location.pathname.split("/").pop() || "account.html";
    location.replace("login.html?next=" + encodeURIComponent(next + location.search));
  }
  function loadCredits() {
    return call("/wallet/summary", {}, true).then(function (data) {
      if (data.code === 401) { setToken(""); renderSignedOut(); return; }
      if (data.code !== 200) { showMsg($("account-msg"), data.msg || UI.err_load, "err"); return; }
      $("coins").textContent = data.data.coins;
      loadLedger();
      return true;
    }).catch(function () { showMsg($("account-msg"), UI.err_net, "err"); return false; });
  }
  function ledgerLabel(kind) {
    return ({creem_topup:UI.buy, ai_music:UI.create, refund:UI.paid_ok,
      creem_refund:UI.refund_label, redeem_code:UI.credits_unit, newbie_gift:UI.credits_unit})[kind] || UI.credits_unit;
  }
  function loadLedger() {
    call("/coin/ledger", {page:1, page_size:20}, true).then(function (data) {
      if (data.code !== 200 || !data.data) return;
      var items = data.data.items || [], box = $("ledger");
      if (!items.length) { box.innerHTML = '<div class="ledger-empty">—</div>'; return; }
      box.innerHTML = items.map(function (item) {
        var amount = Number(item.amount || 0) / 100;
        var sign = amount > 0 ? "+" : "";
        var date = item.created_at ? new Date(item.created_at).toLocaleString(document.documentElement.lang) : "";
        return '<div class="ledger-row"><div><span class="ledger-kind">' + ledgerLabel(item.behavior || "") +
          '</span><span class="ledger-date">' + date + '</span></div><span class="ledger-amount ' +
          (amount >= 0 ? "plus" : "minus") + '">' + sign + amount + '</span></div>';
      }).join("");
    }).catch(function () {});
  }
  $("logout").addEventListener("click", function () {
    call("/auth/logout", {}, true).catch(function () {});
    setToken(""); renderSignedOut();
  });

  function pollAfterPayment() {
    var tries = 0, initial = $("coins").textContent;
    showMsg($("account-msg"), UI.paid_wait, "ok");
    var timer = setInterval(function () {
      tries += 1;
      call("/wallet/summary", {}, true).then(function (data) {
        if (data.code === 200 && data.data.coins !== initial) {
          $("coins").textContent = data.data.coins;
          showMsg($("account-msg"), UI.paid_ok, "ok");
          clearInterval(timer);
        }
      }).catch(function () {});
      if (tries >= 10) { clearInterval(timer); showMsg($("account-msg"), UI.paid_late, ""); }
    }, 3000);
  }

  if (token()) {
    renderSignedIn();
    if (new URLSearchParams(location.search).get("paid")) pollAfterPayment();
  } else {
    renderSignedOut();
  }
})();
</script>

    a.href = main + a.getAttribute("href").slice("https://aiglossa.com".length);
