  function esc(s){var d=document.createElement("div");d.textContent=s||"";return d.innerHTML}function fmt(s){s=isFinite(s)?Math.max(0,s):0;return Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0")}
