  <header><span class="kicker">ラベルガイド</span><h1>AIGLOSSA FOOD レポートの意味</h1><p>読み取る内容、欠損データの扱い、意図的に行わない判断を説明します。</p></header>
  <div class="food-guide-body"><section><h2>包装からレポートへ</h2><p>概要、注意点、対象者向け注記、栄養値、原材料説明、食べ方、データ注記を整理します。</p><p>値は読める表示に基づき、欠損は取得不可、推定は推定として示します。</p></section><section><h2>役割の境界</h2><p>一般的な食品表示情報であり、診断、食事処方、万能な健康評価は行いません。</p><p>医療や個別の食事判断は資格ある専門家に相談してください。</p></section></div>
