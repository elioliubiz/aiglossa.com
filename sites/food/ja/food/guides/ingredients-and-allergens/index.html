  <header><span class="kicker">ラベルガイド</span><h1>原材料、翻訳、アレルゲン</h1><p>原材料の順序、原文、翻訳、推定情報、アレルゲン注意の読み方。</p></header>
  <div class="food-guide-body"><section><h2>並び順の意味</h2><p>原材料は通常、重量の多い順です。ただし表示がなければ正確な量までは分かりません。</p><p>輸入表示では原語と翻訳を並べ、説明を確認しやすくします。</p></section><section><h2>事実と推定を分ける</h2><p>包装に明記されたアレルゲンと、名称から推定した可能性は別です。推定情報は明示します。</p><p>画像が不鮮明な場合、アレルギー判断の前に実物を確認してください。</p></section></div>
