  <header><span class="kicker">标签指南</span><h1>配料、翻译与过敏原</h1><p>理解配料顺序、原文、翻译、推断说明与过敏提示应当如何阅读。</p></header>
  <div class="food-guide-body"><section><h2>配料表有先后顺序</h2><p>配料通常按加入量从多到少排列。这能提供大致背景，但包装未注明时不能据此得出精确含量。</p><p>进口标签同时保留原词和翻译，便于你核对解释是否对应原包装。</p></section><section><h2>事实与推断要区分</h2><p>包装明确标出的过敏原，与根据配料名称推断的可能风险并不相同。AIGLOSSA 会标记推断内容，不把它冒充为标签原文。</p><p>照片模糊或信息缺失时，在作出过敏相关决定前应再次核对实物包装。</p></section></div>
