  <header><span class="kicker">標籤指南</span><h1>成分、翻譯與過敏原</h1><p>理解成分順序、原文、翻譯、推斷說明及過敏提示。</p></header>
  <div class="food-guide-body"><section><h2>成分表具有順序</h2><p>成分通常按使用重量由多至少排列，但未標明時無法由此得出精確含量。</p><p>進口標籤保留原詞與翻譯，讓你能核對說明。</p></section><section><h2>區分事實與推斷</h2><p>包裝明示的過敏原與依成分名稱推斷的可能風險不同；AIGLOSSA 會標示推斷內容。</p><p>照片不清或資訊缺少時，作出過敏相關決定前請核對實物包裝。</p></section></div>
