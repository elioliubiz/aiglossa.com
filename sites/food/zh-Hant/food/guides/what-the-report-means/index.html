  <header><span class="kicker">標籤指南</span><h1>AIGLOSSA FOOD 報告代表什麼</h1><p>了解報告讀取的內容、缺失資料處理方式，以及它不作出的判斷。</p></header>
  <div class="food-guide-body"><section><h2>從包裝到報告</h2><p>報告整理摘要、注意事項、族群提示、營養數值、成分解釋、食用建議及資料說明。</p><p>數值來自可讀標籤；缺失資料顯示為無法取得，推斷內容會被標示。</p></section><section><h2>清楚的使用界線</h2><p>報告提供一般食品標籤資訊，不診斷疾病、制定飲食處方或給出通用健康評分。</p><p>個人需求不同；醫療或個人化飲食決定應諮詢合格專業人士。</p></section></div>
