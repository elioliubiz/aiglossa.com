<style>
  body{min-height:100vh;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;

  .form h1{font-size:26px;line-height:1.2;letter-spacing:-.02em;margin:0 0 6px;font-weight:600}

  .btn:hover{background:var(--accent-soft)}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}

  .hidden{display:none !important}
  .identity{display:flex;align-items:center;gap:18px;margin-block-end:28px}
  .avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;overflow:hidden;
    background:rgba(255,122,26,.12);border:1px solid rgba(255,122,26,.3);color:#ffb27a;font-size:24px;font-weight:600}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .identity h1{margin:0 0 6px}.identity p{margin:0;color:var(--muted);font-size:13px}
  .account-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .panel{border:1px solid var(--line);border-radius:12px;padding:18px;background:rgba(255,255,255,.025)}
  .panel-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 10px}
  .balance{font-size:32px;font-weight:600;margin:0}.balance small{font-size:13px;font-weight:400;color:var(--muted);margin-inline-start:7px}
  .email-value{font-size:15px;margin:0;overflow-wrap:anywhere}
  .links{margin-block-start:18px;display:flex;gap:10px;flex-wrap:wrap}.links .btn{width:auto;min-width:140px}
  .ledger{max-height:52vh;overflow:auto;margin-block-start:12px;border-block-start:1px solid var(--line);padding-block-start:8px}
  .ledger-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding-block:13px;border-block-end:1px solid var(--line)}
  .ledger-kind{font-size:13px;color:var(--fg)}
  .ledger-date{display:block;margin-block-start:3px;font-size:11px;color:var(--dim)}

  .ledger-empty{padding-block:18px;color:var(--muted);font-size:13px}

  .packs{display:grid;gap:8px;margin-block-start:16px}.pack{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;

  .switcher{position:relative}
  .switcher summary{list-style:none;cursor:pointer;font-size:12.5px;color:var(--muted);
                    border:1px solid var(--line);border-radius:999px;padding-block:7px;padding-inline:14px}
  .switcher summary::-webkit-details-marker{display:none}
  .switcher ul{position:absolute;inset-inline-end:0;bottom:calc(100% + 8px);z-index:5;margin:0;

    .form{max-width:420px;margin-inline:auto}
    .account-grid{grid-template-columns:1fr}

<script>
(function () {
  "use strict";
  var UI = JSON.parse(document.getElementById("ui").textContent);
  localStorage.removeItem("aig_token");
  localStorage.removeItem("aig_email");
  var API = location.hostname === "localhost" || location.hostname === "127.0.0.1"
    ? "/api"
    : (location.hostname.indexOf("staging.aiglossa.com") >= 0
      ? "https://dev.staging.aiglossa.com"
      : "https://api.aiglossa.com");
  var balanceUnits = -1;
  var paymentReturnRequested = /[?&]paid=1/.test(location.search);
  var paymentReturn = paymentReturnRequested && !!window.opener;
  if (paymentReturnRequested) {
    history.replaceState(null, "", location.pathname + location.hash);
    if (paymentReturn) {
      // Creem returns the checkout tab to this URL. The opener is the real
      // account page, so this tab must close instead of entering its history.
      setTimeout(function () { try { window.close(); } catch (e) {} }, 0);
    }
  }
  var $ = function (id) { return document.getElementById(id); };
  function device() {
    var v = localStorage.getItem("aig_device");
    if (!v) { v = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())); localStorage.setItem("aig_device", v); }
    return v;
  }
  function call(path, body, auth) {
    var h = { "Content-Type": "application/json", "X-Client": "web" };
    var payload = Object.assign({ app_key: "tools", device: device(), timestamp: Math.floor(Date.now() / 1000) }, body || {});
    return fetch(API + path, { method: "POST", credentials: "include", headers: h, body: JSON.stringify(payload) }).then(function (r) { return r.json(); });
  }
  function showMsg(el, text, kind) { if (!el) return; el.textContent = text || ""; el.className = "msg" + (kind ? " " + kind : ""); }

  function renderSignedOut() {
    var next = location.pathname.split("/").pop() || "account.html";
    location.replace("login.html?next=" + encodeURIComponent(next + location.search));
  }
  function loadCredits() {
    return call("/wallet/summary", {}, true).then(function (data) {
      if (data.code === 401) { renderSignedOut(); return; }
      if (data.code !== 200) { showMsg($("account-msg"), data.msg || UI.err_load, "err"); return; }
      var user = data.data.user || {};
      var name = (user.nickname || "").trim() || UI.account_label;
      var email = user.email || "";
      $("account-name").textContent = name;
      $("account-email").textContent = maskEmail(email) || "—";
      $("coins").textContent = data.data.coins;
      balanceUnits = Number(data.data.balance || 0);
      if (user.avatar) {
        var img = document.createElement("img");
        img.src = /^https?:\/\//.test(user.avatar) ? user.avatar : API + user.avatar;
        img.alt = "";
        $("account-avatar").textContent = ""; $("account-avatar").appendChild(img);
      } else {
        $("account-avatar").textContent = (user.nickname || email || "?").slice(0, 1).toUpperCase();
      }
      return true;
    }).catch(function () { showMsg($("account-msg"), UI.err_net, "err"); return false; });
  }
  function maskEmail(email) {
    var parts = String(email || "").split("@");
    if (parts.length !== 2) return email;
    var local = parts[0], shown = local.slice(0, Math.min(2, local.length));
    return shown + "***@" + parts[1];
  }
  function ledgerLabel(kind) {
    return ({creem_topup:UI.buy, ai_music:UI.create, refund:UI.paid_ok,
      creem_refund:UI.refund_label, redeem_code:UI.credits_unit, newbie_gift:UI.credits_unit})[kind] || UI.credits_unit;
  }
  function loadLedger() {
    $("ledger").innerHTML = '<div class="ledger-empty">…</div>';
    call("/coin/ledger", {page:1, page_size:20}, true).then(function (data) {
      if (data.code !== 200 || !data.data) return;
      var items = data.data.items || [], box = $("ledger");
      if (!items.length) { box.innerHTML = '<div class="ledger-empty">—</div>'; return; }
      box.innerHTML = items.map(function (item) {
        var amount = Number(item.amount || 0) / 100;
        var sign = amount > 0 ? "+" : "";
        var date = item.created_at ? new Date(item.created_at).toLocaleString(document.documentElement.lang) : "";
        return '<div class="ledger-row"><div><span class="ledger-kind">' + ledgerLabel(item.behavior || "") +
          '</span><span class="ledger-date">' + date + '</span></div><span class="ledger-amount ' +
          (amount >= 0 ? "plus" : "minus") + '">' + sign + amount + '</span></div>';
      }).join("");
    }).catch(function () {});
  }
  $("logout").addEventListener("click", function () {
    call("/auth/logout", {}, true).finally(renderSignedOut);
  });
  $("activity").addEventListener("click", function () { $("activity-modal").classList.remove("hidden"); loadLedger(); });
  $("activity-close").addEventListener("click", function () { $("activity-modal").classList.add("hidden"); });
  $("activity-modal").addEventListener("click", function (e) { if (e.target === $("activity-modal")) $("activity-modal").classList.add("hidden"); });

  var FALLBACK_PACKS = [
    {credits:180,price:"$2.99"},{credits:360,price:"$4.99"},{credits:750,price:"$9.99"},
    {credits:1500,price:"$19.99"},{credits:4000,price:"$49.99"}
  ];
  function payMsg(text, bad) { $("pay-msg").textContent = text || ""; $("pay-msg").className = "msg" + (bad ? " err" : ""); }
  function renderPacks(items) {
    $("pay-packs").innerHTML = "";
    items.forEach(function (pack) {
      var button = document.createElement("button"); button.type = "button"; button.className = "pack";
      var amount = document.createElement("b"); amount.textContent = pack.credits + " 크레딧";
      var price = document.createElement("span"); price.textContent = pack.price;
      button.appendChild(amount); button.appendChild(price);
      button.addEventListener("click", function () {
        button.disabled = true; payMsg("결제 페이지로 이동 중…", false);
        var back = location.origin + location.pathname + "?paid=1";
        AiglossaWallet.purchase({call:call,credits:pack.credits,successUrl:back,
          getBalance:function(){return balanceUnits;},refresh:loadCredits,
          onCompleted:function(){payMsg("결제가 완료되어 크레딧이 추가되었습니다.",false);button.disabled=false;},
          onTimeout:function(){payMsg(UI.paid_late,true);button.disabled=false;},
          onError:function(){payMsg(UI.err_net,true);button.disabled=false;}});
      });
      $("pay-packs").appendChild(button);
    });
  }
  function openPay() {
    $("pay-modal").classList.remove("hidden"); payMsg("", false);
    call("/wallet/products", {}, false).then(function (data) {
      renderPacks(data.code === 200 && data.data && data.data.items && data.data.items.length ? data.data.items : FALLBACK_PACKS);
    }).catch(function () { renderPacks(FALLBACK_PACKS); });
  }
  $("buy").addEventListener("click", openPay);
  $("pay-close").addEventListener("click", function () { $("pay-modal").classList.add("hidden"); });
  $("pay-modal").addEventListener("click", function (e) { if (e.target === $("pay-modal")) $("pay-modal").classList.add("hidden"); });

  function pollAfterPayment() {
    var tries = 0, initial = $("coins").textContent;
    showMsg($("account-msg"), UI.paid_wait, "ok");
    var timer = setInterval(function () {
      tries += 1;
      call("/wallet/summary", {}, true).then(function (data) {
        if (data.code === 200 && data.data.coins !== initial) {
          $("coins").textContent = data.data.coins;
          showMsg($("account-msg"), UI.paid_ok, "ok");
          clearInterval(timer);
        }
      }).catch(function () {});
      if (tries >= 10) { clearInterval(timer); showMsg($("account-msg"), UI.paid_late, ""); }
    }, 3000);
  }

  loadCredits().then(function (ok) {
    if (!ok) return;
    $("account-card").classList.remove("hidden");
    if (paymentReturnRequested) pollAfterPayment();
  });
})();
</script>

<script>
(function () {
  var h = location.hostname;
  if (h.indexOf("staging.aiglossa.com") < 0) return;
  var main = "https://staging.aiglossa.com";
  document.querySelectorAll('a[href^="https://aiglossa.com"]').forEach(function (a) {
    a.href = main + a.getAttribute("href").slice("https://aiglossa.com".length);
  });
})();
</script>
