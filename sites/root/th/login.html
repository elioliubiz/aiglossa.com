<!DOCTYPE html>
<html lang="th" dir="ltr" data-default-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เข้าสู่ระบบ — aiglossa tools</title>
<meta name="description" content="เข้าสู่ระบบ aiglossa tools เพื่อดูเครดิตและดาวน์โหลดเพลงที่สร้างไว้">
<link rel="canonical" href="https://aiglossa.com/th/login.html">
<link rel="alternate" hreflang="ar" href="https://aiglossa.com/ar/login.html">
<link rel="alternate" hreflang="de" href="https://aiglossa.com/de/login.html">
<link rel="alternate" hreflang="en" href="https://aiglossa.com/en/login.html">
<link rel="alternate" hreflang="es" href="https://aiglossa.com/es/login.html">
<link rel="alternate" hreflang="fr" href="https://aiglossa.com/fr/login.html">
<link rel="alternate" hreflang="id" href="https://aiglossa.com/id/login.html">
<link rel="alternate" hreflang="it" href="https://aiglossa.com/it/login.html">
<link rel="alternate" hreflang="ja" href="https://aiglossa.com/ja/login.html">
<link rel="alternate" hreflang="ko" href="https://aiglossa.com/ko/login.html">
<link rel="alternate" hreflang="pt" href="https://aiglossa.com/pt/login.html">
<link rel="alternate" hreflang="ru" href="https://aiglossa.com/ru/login.html">
<link rel="alternate" hreflang="th" href="https://aiglossa.com/th/login.html">
<link rel="alternate" hreflang="tr" href="https://aiglossa.com/tr/login.html">
<link rel="alternate" hreflang="vi" href="https://aiglossa.com/vi/login.html">
<link rel="alternate" hreflang="zh-Hans" href="https://aiglossa.com/zh-Hans/login.html">
<link rel="alternate" hreflang="zh-Hant" href="https://aiglossa.com/zh-Hant/login.html">
<link rel="alternate" hreflang="x-default" href="https://aiglossa.com/en/login.html">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#08080a">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/site.css">
<style>
  :root{--bg:#08080a;--ink:#f4f2ee;--mut:#8b8b96;--line:rgba(255,255,255,.12);--acc:#ff7a1a}
  body{background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;
       font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;margin:0;overflow-x:hidden}
  .glow{position:fixed;inset:0;pointer-events:none;
        background:radial-gradient(60rem 40rem at 50% -10%,rgba(255,122,26,.18),transparent 65%)}
  .card{position:relative;width:min(420px,92vw);padding:34px 30px 26px;border-radius:20px;
        border:1px solid var(--line);background:rgba(255,255,255,.035)}
  .brand{display:flex;align-items:center;gap:9px;color:var(--mut);font-size:11px;letter-spacing:.22em;
         text-transform:uppercase;margin-bottom:22px}
  .brand i{width:8px;height:8px;border-radius:50%;background:var(--acc);display:block}
  h1{margin:0 0 8px;font-size:24px;letter-spacing:-.02em}
  .sub{margin:0 0 22px;color:var(--mut);font-size:13.5px;line-height:1.6}
  label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
  input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
        background:rgba(255,255,255,.04);color:var(--ink);font:inherit;font-size:14px}
  input:focus{outline:none;border-color:var(--acc)}
  .password-field{position:relative}
  .password-field input{padding-inline-end:48px}
  .password-toggle{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);
    display:grid;place-items:center;width:36px;height:36px;border:0;background:transparent;color:var(--mut);
    padding:0;border-radius:7px;cursor:pointer}
  .password-toggle:hover,.password-toggle:focus-visible{color:var(--ink);background:rgba(255,255,255,.07);outline:none}
  .password-toggle svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;
    stroke-linecap:round;stroke-linejoin:round}
  .password-toggle .eye-off{display:none}
  .password-toggle[aria-pressed="true"] .eye{display:none}
  .password-toggle[aria-pressed="true"] .eye-off{display:block}
  .btn{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:var(--acc);
       color:#101114;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .btn.ghost{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line)}
  .div{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--mut);font-size:11px}
  .div::before,.div::after{content:"";flex:1;height:1px;background:var(--line)}
  .msg{min-height:16px;font-size:12px;margin-top:10px;color:var(--mut)}
  .msg.err{color:#ff9b9b}
  .foot{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;
        color:var(--mut);line-height:1.8;text-align:start}
  .foot a{color:var(--ink)}
  .hidden{display:none}
  .legalrow{margin:6px 0 0;padding:0;border:0;display:flex;gap:10px;
        justify-content:flex-start;align-items:center}
  .forgot{margin:10px 0 0;font-size:12px;text-align:center}
  .forgot a{color:var(--mut)}
  .tabs{display:flex;gap:6px;background:rgba(255,255,255,.05);padding:4px;border-radius:10px;margin-bottom:16px}
  .tab{flex:1;padding:8px;border:0;border-radius:8px;background:none;color:var(--mut);
    font:inherit;font-size:12.5px;cursor:pointer}
  .tab.on{background:rgba(255,255,255,.1);color:var(--ink)}
</style>
</head>
<body>
<div class="glow"></div>
<form class="card" id="f">
  <div class="brand"><i></i>aiglossa</div>
  <h1>เข้าสู่ระบบ</h1>
  <p class="sub">เข้าสู่ระบบบัญชีเพื่อใช้งาน Aiglossa ต่อ</p>

  <button type="button" class="btn ghost" id="google">ดำเนินการต่อด้วย Google</button>
  <div class="div">หรือใช้อีเมล</div>

  <div class="tabs">
    <button type="button" class="tab on" id="tabCode">รหัส</button>
    <button type="button" class="tab" id="tabPwd">รหัสผ่าน</button>
  </div>

  <label for="email">อีเมล</label>
  <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required>

  <div id="pwdWrap" class="hidden">
    <label for="pwd" style="margin-top:12px">รหัสผ่าน</label>
    <div class="password-field">
      <input id="pwd" type="password" placeholder="รหัสผ่านของคุณ" autocomplete="current-password">
      <button class="password-toggle" type="button" data-password="pwd" aria-pressed="false"
              aria-label="แสดง" title="แสดง">
        <svg class="eye" aria-hidden="true" viewBox="0 0 24 24"><path d="M2.1 12a10.9 10.9 0 0 1 19.8 0 10.9 10.9 0 0 1-19.8 0"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="eye-off" aria-hidden="true" viewBox="0 0 24 24"><path d="m2 2 20 20"/><path d="M6.7 6.7A10.8 10.8 0 0 0 2.1 12a10.9 10.9 0 0 0 16.2 4.6"/><path d="M10.7 5.1A11.7 11.7 0 0 1 12 5c4.8 0 8.9 3 9.9 7a10.8 10.8 0 0 1-2.1 3.2"/><path d="M14.1 14.1A3 3 0 0 1 9.9 9.9"/></svg>
      </button>
    </div>
  </div>

  <div id="codeWrap" class="hidden">
    <label for="code" style="margin-top:12px">รหัส 6 หลัก</label>
    <input id="code" inputmode="numeric" maxlength="6" placeholder="123456" autocomplete="one-time-code">
  </div>

  <button class="btn" id="go" type="submit">ส่งรหัส</button>
  <p class="forgot hidden" id="forgotWrap"><a href="#" id="forgot">ลืมรหัสผ่าน?</a></p>

  <div id="resetWrap" class="hidden">
    <label for="npwd" style="margin-top:12px">รหัสผ่านใหม่</label>
    <div class="password-field">
      <input id="npwd" type="password" autocomplete="new-password">
      <button class="password-toggle" type="button" data-password="npwd" aria-pressed="false"
              aria-label="แสดง" title="แสดง">
        <svg class="eye" aria-hidden="true" viewBox="0 0 24 24"><path d="M2.1 12a10.9 10.9 0 0 1 19.8 0 10.9 10.9 0 0 1-19.8 0"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="eye-off" aria-hidden="true" viewBox="0 0 24 24"><path d="m2 2 20 20"/><path d="M6.7 6.7A10.8 10.8 0 0 0 2.1 12a10.9 10.9 0 0 0 16.2 4.6"/><path d="M10.7 5.1A11.7 11.7 0 0 1 12 5c4.8 0 8.9 3 9.9 7a10.8 10.8 0 0 1-2.1 3.2"/><path d="M14.1 14.1A3 3 0 0 1 9.9 9.9"/></svg>
      </button>
    </div>
    <button class="btn" id="resetGo" type="button">รีเซ็ตรหัสผ่าน</button>
    <p class="msg" id="rmsg"></p>
  </div>
  <p class="msg" id="msg"></p>
  <p class="foot" id="accountHint">ครั้งแรกใช่ไหม? ระบบจะสร้างบัญชีให้อัตโนมัติ<br>การดำเนินการต่อถือว่าคุณยอมรับ</p>
  <p class="foot legalrow">
    <a href="https://aiglossa.com/th/protocol/term.html">ข้อกำหนด</a> ·
    <a href="https://aiglossa.com/th/protocol/privacy.html">นโยบายความเป็นส่วนตัว</a>
  </p>
</form>
<script>
(function () {
  // 环境判定：第一段描述"是什么"，staging 描述"在哪个环境"
  var HOST = location.hostname;
  var IS_STAGING = HOST.indexOf("staging.aiglossa.com") >= 0 && HOST.indexOf("dev.staging") !== 0;
  var IS_LOCAL = HOST === "localhost" || HOST === "127.0.0.1";
  var API = IS_LOCAL ? "/api" : (IS_STAGING ? "https://dev.staging.aiglossa.com" : "https://api.aiglossa.com");
  var LANG = document.documentElement.lang || "en";
  var $ = function (id) { return document.getElementById(id); };
  var sent = false, email = "", mode = "code";
  function msg(t, bad) { var m = $("msg"); m.textContent = t || ""; m.className = "msg" + (bad ? " err" : ""); }
  function next() {
    var q = new URLSearchParams(location.search).get("next");
    if (q) {
      try {
        var target = new URL(q, location.href);
        var allowedOrigins = [
          location.origin,
          "https://aiglossa.com",
          "https://staging.aiglossa.com",
          "https://tools.aiglossa.com",
          "https://tools.staging.aiglossa.com",
          "https://food.aiglossa.com",
          "https://food.staging.aiglossa.com",
          "https://scholan.aiglossa.com"
        ];
        var allowed = allowedOrigins.indexOf(target.origin) >= 0;
        if (allowed) return target.href;
      } catch (e) {}
    }
    if (IS_LOCAL || HOST.indexOf("tools.") === 0) return location.origin + "/" + LANG + "/music/";
    return (IS_STAGING ? "https://tools.staging.aiglossa.com" : "https://tools.aiglossa.com")
      + "/" + LANG + "/music/";
  }
  function accept(data) {
    if (data.code !== 200) { msg(data.msg || "Failed", true); return false; }
    localStorage.removeItem("aig_token");
    localStorage.removeItem("aig_email");
    location.replace(next());
    return true;
  }
  function call(path, body) {
    var payload = Object.assign({ app_key: "tools", device: device(), timestamp: Math.floor(Date.now() / 1000) }, body || {});
    return fetch(API + path, {
      method: "POST", credentials: "include",
      headers: { "Content-Type": "application/json", "X-Client": "web" },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.json(); });
  }
  function busy(button, on, label) {
    button.disabled = on;
    if (on) {
      button.dataset.label = label;
      button.textContent = label + "…";
      button.setAttribute("aria-busy", "true");
    } else {
      button.textContent = button.dataset.label || label;
      button.removeAttribute("aria-busy");
    }
  }
  function device() {
    var v = localStorage.getItem("aig_device");
    if (!v) { v = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())); localStorage.setItem("aig_device", v); }
    return v;
  }
  var resetTicket = "";
  document.querySelectorAll("[data-password]").forEach(function (button) {
    button.addEventListener("click", function () {
      var input = $(button.getAttribute("data-password"));
      var visible = input.type === "text";
      input.type = visible ? "password" : "text";
      button.setAttribute("aria-pressed", visible ? "false" : "true");
      button.setAttribute("aria-label", visible ? "แสดง" : "ซ่อน");
      button.setAttribute("title", visible ? "แสดง" : "ซ่อน");
    });
  });
  $("forgot").addEventListener("click", function (e) {
    e.preventDefault();
    mode = "reset"; sent = false;
    $("resetWrap").classList.add("hidden");
    $("pwdWrap").classList.add("hidden");
    $("codeWrap").classList.add("hidden");
    $("forgotWrap").classList.add("hidden");
    $("accountHint").classList.add("hidden");
    $("go").textContent = "ส่งรหัส";
    msg("รีเซ็ตรหัสผ่าน");
  });
  $("resetGo").addEventListener("click", function () {
    if (!resetTicket) return;
    busy($("resetGo"), true, "รีเซ็ตรหัสผ่าน");
    call("/auth/password/reset", { ticket: resetTicket, password: $("npwd").value }).then(function (d) {
      if (d.code !== 200) { busy($("resetGo"), false, "รีเซ็ตรหัสผ่าน"); $("rmsg").textContent = d.msg || "error"; $("rmsg").className = "msg err"; return; }
      $("rmsg").textContent = "อัปเดตรหัสผ่านแล้ว เข้าสู่ระบบด้วยรหัสใหม่"; $("rmsg").className = "msg";
      mode = "password"; $("tabPwd").click();
      busy($("resetGo"), false, "รีเซ็ตรหัสผ่าน");
    }).catch(function () { busy($("resetGo"), false, "รีเซ็ตรหัสผ่าน"); $("rmsg").textContent = "เครือข่ายขัดข้อง"; $("rmsg").className = "msg err"; });
  });

  $("tabCode").addEventListener("click", function () {
    mode = "code"; $("tabCode").classList.add("on"); $("tabPwd").classList.remove("on");
    $("pwdWrap").classList.add("hidden"); $("codeWrap").classList.toggle("hidden", !sent);
    $("forgotWrap").classList.add("hidden"); $("accountHint").classList.remove("hidden");
    $("go").textContent = sent ? "เข้าสู่ระบบ" : "ส่งรหัส";
  });
  $("tabPwd").addEventListener("click", function () {
    mode = "password"; $("tabPwd").classList.add("on"); $("tabCode").classList.remove("on");
    $("pwdWrap").classList.remove("hidden"); $("codeWrap").classList.add("hidden");
    $("forgotWrap").classList.remove("hidden"); $("accountHint").classList.add("hidden");
    $("go").textContent = "เข้าสู่ระบบ";
  });
  $("f").addEventListener("submit", function (e) {
    e.preventDefault();
    if (mode === "password") {
      busy($("go"), true, "เข้าสู่ระบบ");
      call("/auth/login", { provider: "password", account: $("email").value.trim(), code: $("pwd").value }).then(function (d) {
        if (d.code !== 200) { busy($("go"), false, "เข้าสู่ระบบ"); msg(d.msg || "Failed", true); return; }
        accept(d);
      }).catch(function () { busy($("go"), false, "เข้าสู่ระบบ"); msg("เครือข่ายขัดข้อง", true); });
      return;
    }
    if (mode === "reset") {
      email = $("email").value.trim();
      if (!sent) {
        busy($("go"), true, "ส่งรหัส");
        call("/auth/code/send", { account: email, purpose: "reset_password" }).then(function (d) {
          busy($("go"), false, "ส่งรหัส");
          if (d.code !== 200) { msg(d.msg || "Failed", true); return; }
          sent = true; $("codeWrap").classList.remove("hidden"); $("go").textContent = "เข้าสู่ระบบ"; $("code").focus();
        }).catch(function () { busy($("go"), false, "ส่งรหัส"); msg("เครือข่ายขัดข้อง", true); });
        return;
      }
      busy($("go"), true, "เข้าสู่ระบบ");
      call("/auth/code/verify", { account: email, purpose: "reset_password", code: $("code").value.trim() }).then(function (d) {
        busy($("go"), false, "เข้าสู่ระบบ");
        if (d.code !== 200) { msg(d.msg || "Failed", true); return; }
        resetTicket = (d.data && d.data.ticket) || "";
        $("codeWrap").classList.add("hidden"); $("resetWrap").classList.remove("hidden"); $("npwd").focus();
      }).catch(function () { busy($("go"), false, "เข้าสู่ระบบ"); msg("เครือข่ายขัดข้อง", true); });
      return;
    }
    if (!sent) {
      email = $("email").value.trim();
      if (!email) return;
      msg("");
      busy($("go"), true, "ส่งรหัส");
      call("/auth/code/send", { account: email, purpose: "login" }).then(function (d) {
        busy($("go"), false, "ส่งรหัส");
        if (d.code !== 200) { msg(d.msg || "Failed", true); return; }
        sent = true; $("codeWrap").classList.remove("hidden"); $("go").textContent = "เข้าสู่ระบบ"; $("code").focus();
      }).catch(function () { busy($("go"), false, "ส่งรหัส"); msg("เครือข่ายขัดข้อง", true); });
      return;
    }
    busy($("go"), true, "เข้าสู่ระบบ");
    call("/auth/login", { provider: "code", account: email, code: $("code").value.trim() }).then(function (d) {
      if (d.code !== 200) { busy($("go"), false, "เข้าสู่ระบบ"); msg(d.msg || "Failed", true); return; }
      accept(d);
    }).catch(function () { busy($("go"), false, "เข้าสู่ระบบ"); msg("เครือข่ายขัดข้อง", true); });
  });
  $("google").addEventListener("click", function () {
    location.href = API + "/auth/google/start?app_key=tools&next=" + encodeURIComponent(next());
  });
})();
</script>

<script>
(function () {
  var h = location.hostname;
  if (h.indexOf("staging.aiglossa.com") < 0) return;
  var main = "https://staging.aiglossa.com";
  document.querySelectorAll('a[href^="https://aiglossa.com"]').forEach(function (a) {
    a.href = main + a.getAttribute("href").slice("https://aiglossa.com".length);
  });
})();
</script>
</body>
</html>
